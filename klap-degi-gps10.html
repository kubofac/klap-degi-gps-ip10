<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>KLAP DEGI ULTIMATE V2 - FINAL</title>
    <style>
        :root { 
            --hrc-red: #E4002B; --hrc-blue: #004098; --hrc-white: #ffffff; 
            --bg-dark: #000000; --hrc-orange: #FFA500;
        }

        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background-color: var(--bg-dark); color: var(--hrc-white); 
            font-family: 'Arial Black', sans-serif; overflow: hidden; 
        }

        #dashboard { position: relative; display: flex; flex-direction: column; height: 100dvh; width: 100vw; }
        #canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: calc(100% - 60px) !important; z-index: 1; }
        
        .main-ui-container {
            position: absolute; right: 10px; top: 100px; bottom: 70px; 
            display: flex; align-items: flex-start; gap: 40px; z-index: 20; pointer-events: none;
        }

        #info-overlay { display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 5px; }
        #rpm_val { font-size: 11vh; font-weight: 900; line-height: 0.8; text-shadow: 3px 3px 12px #000; }
        #display1 { font-size: 16vh; font-weight: 900; line-height: 0.9; color: var(--hrc-white); text-shadow: 4px 4px 15px #000; }
        #display { font-size: 3.5vh; color: #bbb; text-shadow: 1px 1px 6px #000; }

        .right-panels { display: flex; flex-direction: row; gap: 15px; height: 100%; align-items: flex-start; pointer-events: auto; }
        #lap-panel { width: 160px; height: 100%; display: flex; flex-direction: column; overflow: hidden; border-top: 2px solid #333; }
        #lap { flex: 1; overflow-y: auto; scrollbar-width: none; }
        .lap-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 16px; font-weight: 900; }
        .best-lap { color: var(--hrc-red); }

        .data-panel { display: flex; flex-direction: column; gap: 12px; width: 100px; }
        .data-box { display: flex; flex-direction: column; align-items: flex-end; }
        .label { font-size: 10px; color: var(--hrc-red); font-weight: bold; }
        .val { font-size: 36px; font-weight: 900; line-height: 0.9; }

        footer { 
            height: 55px; display: flex; gap: 4px; padding: 4px; background: #000; border-top: 1px solid #333; 
            z-index: 100; position: fixed; bottom: 0; left: 0; right: 0; padding-bottom: env(safe-area-inset-bottom);
        }
        button { flex: 1; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
        #saveLogBtn { background: #155724 !important; display: none; }
        .active-btn { background: var(--hrc-red) !important; color: white !important; }
    </style>
</head>
<body>

<div id="dashboard">
    <canvas id="canvas"></canvas>
    <div class="main-ui-container">
        <div id="info-overlay">
            <div id="rpm_val">0</div>
            <div id="display1">00:00.000</div>
            <div id="display">TOTAL 00:00.000</div>
        </div>
        <div class="right-panels">
            <div id="lap-panel"><div id="lap"></div></div>
            <div class="data-panel">
                <div class="data-box"><div class="label">SPEED</div><div class="val" id="speed_val">0</div></div>
                <div class="data-box"><div class="label">MAX</div><div class="val" id="max_speed_val" style="color: #FFA500;">0</div></div>
                <div class="data-box"><div class="label">TEMP</div><div class="val" id="temp_val">--</div></div>
            </div>
        </div>
    </div>
    <footer>
        <button id="btConnect">BLE START</button>
        <button id="startBtn">TIMER</button>
        <button id="lapBtn">LAP/RESET</button>
        <button id="saveLogBtn">LOG SAVE</button>
        <button id="reloadBtn">RELOAD</button>
    </footer>
</div>

<script>
'use strict';

const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const PULSE_UUID = "f4deb353-a4cf-4ffb-badb-2a5f2e3bb630";

let currentRPM = 0, currentTemp = 0, currentSpeedKmh = 0, maxSpeed = 0, sessionMaxSpeed = 0;
let swState = 0, startTime = 0, lapStartTime = 0, lapRecords = [], lastLapTime = 0;
let trackLogs = [], currentLapLog = [], lastPos = null, lastBleDataTime = 0;
let isFrozen = false, freezeDisplayTime = "", freezeStartTime = 0, previousSideOfLine = null;
let LAP_LINE_P1 = { lat: 0, lon: 0 }, LAP_LINE_P2 = { lat: 0, lon: 0 };

const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

// --- BLE接続 & ESP32パケットパース ---
async function startBle() {
    try {
        const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const char = await service.getCharacteristic(PULSE_UUID);
        
        await char.startNotifications();
        char.oncharacteristicvaluechanged = (e) => {
            lastBleDataTime = Date.now();
            const d = e.target.value;

            // 想定パケット: [0-1]RPM, [2]Temp, [3-6]Lat*10^7, [7-10]Lon*10^7, [11]Speed
            if (d.byteLength >= 3) {
                let hz = d.getUint8(0) | (d.getUint8(1) << 8);
                currentRPM = (hz * 60) / (parseInt(localStorage.getItem('pl1')) || 1);
                currentTemp = d.getUint8(2);
                document.getElementById('temp_val').textContent = currentTemp;

                if (d.byteLength >= 12) {
                    const lat = d.getInt32(3, true) / 10000000;
                    const lon = d.getInt32(7, true) / 10000000;
                    currentSpeedKmh = d.getUint8(11);
                    document.getElementById('speed_val').textContent = currentSpeedKmh;

                    if (lat !== 0 && lon !== 0) {
                        const cur = { lat, lon, time: Date.now(), rpm: currentRPM, temp: currentTemp, speed: currentSpeedKmh };
                        
                        if (swState === 1) {
                            currentLapLog.push(cur);
                            if (currentSpeedKmh > maxSpeed) maxSpeed = currentSpeedKmh;
                            if (maxSpeed > sessionMaxSpeed) sessionMaxSpeed = maxSpeed;
                            checkLap(cur);
                        }
                        lastPos = cur;
                    }
                }
            }
        };
    } catch (e) { console.error("BLE Error:", e); }
}

// 通過判定 (ライン跨ぎ)
function checkLap(cur) {
    if (LAP_LINE_P1.lat === 0 || !lastPos) return;
    const side = (LAP_LINE_P2.lon - LAP_LINE_P1.lon) * (cur.lat - LAP_LINE_P1.lat) - (LAP_LINE_P2.lat - LAP_LINE_P1.lat) * (cur.lon - LAP_LINE_P1.lon);
    
    if (previousSideOfLine !== null && ((previousSideOfLine > 0 && side < 0) || (previousSideOfLine < 0 && side > 0))) {
        const now = Date.now();
        if (now - lastLapTime >= (parseFloat(localStorage.getItem('lapCoolDownTime')) || 15000)) {
            processLap(now, true);
        }
    }
    previousSideOfLine = side;
}

// ラップ確定
function processLap(exactTime, useFreeze) {
    const lapTime = exactTime - (lapStartTime || startTime);
    lapRecords.unshift(lapTime);
    trackLogs.push([...currentLapLog]);
    currentLapLog = [];
    
    const finishedMax = maxSpeed; 
    maxSpeed = 0; 
    lapStartTime = exactTime; 
    lastLapTime = exactTime;

    const d = document.getElementById('lap'); d.innerHTML = "";
    const best = Math.min(...lapRecords);
    lapRecords.forEach((t, i) => {
        const r = document.createElement('div'); r.className = `lap-row ${t === best ? 'best-lap' : ''}`;
        r.innerHTML = `<span>L${lapRecords.length-i}</span><span>${timeFormat(t)}</span>`; d.appendChild(r);
    });

    if (useFreeze) {
        isFrozen = true; 
        freezeDisplayTime = timeFormat(lapTime);
        document.getElementById('max_speed_val').textContent = finishedMax;
        document.getElementById('max_speed_val').style.color = (finishedMax >= sessionMaxSpeed) ? "var(--hrc-red)" : "#FFA500";
        freezeStartTime = Date.now();
    }
}

// 保存機能 (Bluefy/iOSコピー方式)
function exportGPX() {
    const all = [...trackLogs]; if (currentLapLog.length > 0) all.push(currentLapLog);
    if (all.length === 0 || all[0].length === 0) { alert("有効なログがありません"); return; }
    
    const chunks = ['<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="KLAP_ULT" xmlns="http://www.topografix.com/GPX/1/1" xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1">'];
    all.forEach((lap, i) => {
        chunks.push(`<trk><name>Lap ${i+1}</name><trkseg>`);
        lap.forEach(p => {
            chunks.push(`<trkpt lat="${p.lat.toFixed(7)}" lon="${p.lon.toFixed(7)}"><time>${new Date(p.time).toISOString()}</time><extensions><gpxtpx:TrackPointExtension><gpxtpx:hr>${Math.round(p.rpm)}</gpxtpx:hr><gpxtpx:atemp>${p.temp}</gpxtpx:atemp></gpxtpx:TrackPointExtension><speed>${(p.speed / 3.6).toFixed(2)}</speed></extensions></trkpt>`);
        });
        chunks.push(`</trkseg></trk>`);
    });
    chunks.push(`</gpx>`);
    
    const gpxText = chunks.join('');
    const old = document.getElementById('save-overlay'); if (old) old.remove();
    const overlay = document.createElement('div'); overlay.id = 'save-overlay';
    overlay.style = "position:fixed; top:0; left:0; width:100%; height:100%; background:#111; z-index:10000; display:flex; flex-direction:column; padding:20px; box-sizing:border-box;";
    overlay.innerHTML = `<h3 style="color:white; font-size:14px;">GPX LOG SAVE (COPY & PASTE)</h3><textarea id="gpx-text-area" readonly style="flex:1; width:100%; background:#000; color:#0f0; font-family:monospace; font-size:10px; padding:10px;">${gpxText}</textarea>
        <div style="display:flex; gap:10px; margin-top:15px;"><button id="copy-btn" style="flex:1; background:#E4002B; color:white; padding:15px; border:none; font-weight:bold;">COPY ALL</button><button onclick="document.getElementById('save-overlay').remove()" style="flex:1; background:#444; color:white; padding:15px; border:none;">CLOSE</button></div>`;
    document.body.appendChild(overlay);
    document.getElementById('copy-btn').onclick = () => {
        const area = document.getElementById('gpx-text-area'); area.select(); area.setSelectionRange(0, 999999);
        document.execCommand('copy'); alert("クリップボードにコピーしました");
    };
}

function timeFormat(ms) {
    let m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000), mss = Math.floor(ms%1000);
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${mss.toString().padStart(3,'0')}`;
}

function tick() {
    if (swState !== 1) return;
    const now = Date.now();
    document.getElementById('display').textContent = "TOTAL " + timeFormat(now - startTime);
    if (isFrozen) {
        document.getElementById('display1').textContent = freezeDisplayTime;
        if (now - freezeStartTime > 15000) isFrozen = false;
    } else {
        document.getElementById('display1').textContent = timeFormat(now - lapStartTime);
        document.getElementById('max_speed_val').textContent = maxSpeed;
    }
    requestAnimationFrame(tick);
}

// 状態監視インジケーター & 設定警告
setInterval(() => {
    const bBtn = document.getElementById('btConnect');
    const rBtn = document.getElementById('reloadBtn');
    const now = Date.now();

    // BLE受信中なら赤
    if (lastBleDataTime !== 0 && (now - lastBleDataTime < 2000)) {
        bBtn.classList.add('active-btn'); bBtn.textContent = "BLE FIXED";
    } else {
        bBtn.classList.remove('active-btn'); bBtn.textContent = "BLE START";
    }

    // 設定不足ならオレンジ (localStorageの重要項目をチェック)
    const hasConfig = localStorage.getItem('startLineP1Lat') && localStorage.getItem('startLineP2Lat') && localStorage.getItem('pl1');
    rBtn.style.backgroundColor = hasConfig ? "#1a1a1a" : "var(--hrc-orange)";
}, 1000);

document.getElementById('btConnect').onclick = startBle;
document.getElementById('saveLogBtn').onclick = exportGPX;

document.getElementById('startBtn').onclick = () => {
    if (swState !== 1) {
        swState = 1; startTime = Date.now(); lapStartTime = startTime; trackLogs = []; currentLapLog = []; maxSpeed = 0;
        document.getElementById('startBtn').classList.add('active-btn');
        document.getElementById('saveLogBtn').style.display = 'none';
        tick();
    } else {
        swState = 2; document.getElementById('startBtn').classList.remove('active-btn');
        document.getElementById('saveLogBtn').style.display = 'block';
    }
};

document.getElementById('lapBtn').onclick = () => {
    if(swState === 1) processLap(Date.now(), false);
    else {
        swState = 0; lapRecords = []; trackLogs = []; currentLapLog = []; maxSpeed = 0; sessionMaxSpeed = 0;
        document.getElementById('max_speed_val').textContent = "0"; document.getElementById('lap').innerHTML = "";
        document.getElementById('display1').textContent = "00:00.000"; document.getElementById('display').textContent = "TOTAL 00:00.000";
    }
};

document.getElementById('reloadBtn').onclick = () => location.reload();

function drawTacho(rpm) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const w = canvas.width, h = canvas.height, segments = 75, active = Math.floor((rpm / 14000) * segments);
    const sX = 20, hY = 80, bY = h - 20, rad = bY - hY, curveEnd = 30;
    for (let i = 0; i <= segments; i++) {
        let x, y, ang, prog;
        if (i <= curveEnd) {
            prog = i / curveEnd; ang = Math.PI + (prog * (Math.PI / 2)); x = sX + rad + Math.cos(ang) * rad; y = hY + rad + Math.sin(ang) * rad;
        } else {
            prog = (i - curveEnd) / (segments - curveEnd); x = (sX + rad) + (prog * (w - 15 - (sX + rad))); y = hY; ang = 1.5 * Math.PI;
        }
        if (i % 10 === 0 || i === segments) {
            ctx.save(); ctx.fillStyle = i < active ? "#fff" : "#444"; ctx.font = "italic bold 20px Arial"; ctx.textAlign = "center";
            ctx.fillText(Math.round((i / segments) * 14), x + Math.cos(ang) * 40, y + Math.sin(ang) * 40); ctx.restore();
        }
        if (i < segments) {
            ctx.fillStyle = i < active ? (((i/segments)*14000) >= 12500 ? "#E4002B" : (((i/segments)*14000) >= 8000 ? "#004098" : "#FFFFFF")) : "#222";
            ctx.save(); ctx.translate(x, y); ctx.rotate(ang + Math.PI / 2); ctx.fillRect(-4, -20, 8, 40); ctx.restore();
        }
    }
    document.getElementById('rpm_val').textContent = Math.floor(rpm);
}

window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight - 60; };
window.onload = () => {
    window.dispatchEvent(new Event('resize'));
    const p1 = localStorage.getItem('startLineP1Lat');
    if (p1) {
        LAP_LINE_P1 = { lat: parseFloat(p1), lon: parseFloat(localStorage.getItem('startLineP1Lon')) };
        LAP_LINE_P2 = { lat: parseFloat(localStorage.getItem('startLineP2Lat')), lon: parseFloat(localStorage.getItem('startLineP2Lon')) };
    }
    (function render(){ drawTacho(currentRPM); requestAnimationFrame(render); })();
};
</script>
</body>
</html>
