<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10Hz GPS & BLE DIAGNOSIS</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 20px; margin: 0; }
        .header { border-bottom: 2px solid #0088ff; padding-bottom: 10px; margin-bottom: 20px; }
        .status-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: #111; border: 1px solid #333; padding: 10px; border-radius: 5px; text-align: center; }
        
        .data-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        .data-card { background: #1a1a1a; border-left: 5px solid #0088ff; padding: 15px; border-radius: 4px; }
        
        .label { color: #888; font-size: 12px; margin-bottom: 5px; display: block; }
        .val { font-size: 32px; font-weight: bold; color: #fff; }
        .unit { font-size: 16px; color: #666; margin-left: 5px; }
        
        button { width: 100%; height: 80px; background: #0088ff; color: white; border: none; font-size: 22px; border-radius: 15px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        button:active { background: #0055aa; }

        #log { font-size: 12px; color: #666; height: 120px; overflow-y: scroll; background: #050505; padding: 10px; border: 1px solid #222; }
        .pulse { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: #333; margin-right: 8px; }
        .active { background: #0f0; box-shadow: 0 0 10px #0f0; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0; color:#0088ff;">SYSTEM DIAGNOSIS v3.0</h2>
    </div>

    <button id="btn">BLE CONNECT & START</button>

    <div class="status-bar">
        <div class="stat-box">
            <div class="label"><span id="pulse" class="pulse"></span>TOTAL RECV</div>
            <div id="count" class="val" style="color: #0f0;">0</div>
        </div>
        <div class="stat-box">
            <div class="label">CURRENT RATE</div>
            <div id="rate" class="val" style="color: #FFA500;">0.0<span class="unit">Hz</span></div>
        </div>
    </div>

    <div class="data-grid">
        <div class="data-card">
            <span class="label">GPS COORDINATES (LAT, LNG)</span>
            <div id="pos" class="val" style="font-size: 24px;">GPS SEARCHING...</div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="data-card">
                <span class="label">SPEED</span>
                <div><span id="speed" class="val">0</span><span class="unit">km/h</span></div>
            </div>
            <div class="data-card">
                <span class="label">WATER TEMP</span>
                <div><span id="temp" class="val">0</span><span class="unit">℃</span></div>
            </div>
        </div>

        <div class="data-card" style="border-left-color: #FFA500;">
            <span class="label">ENGINE SPEED (DUMMY)</span>
            <div><span id="rpm" class="val" style="color: #FFA500;">0</span><span class="unit">RPM</span></div>
            <div style="font-size: 12px; color: #444; margin-top:5px;">Frequency: <span id="hz">0</span> Hz</div>
        </div>
    </div>

    <p class="label" style="margin-top:20px;">SYSTEM LOGS</p>
    <div id="log">Ready to connect...</div>

<script>
const S_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const C_UUID = "f4deb353-a4cf-4ffb-badb-2a5f2e3bb630";

let recvCount = 0;
let lastTime = Date.now();
let frames = 0;

function addLog(m) {
    const l = document.getElementById('log');
    l.innerHTML = "[" + new Date().toLocaleTimeString() + "] " + m + "<br>" + l.innerHTML;
}

// 1秒ごとの更新レート計算
setInterval(() => {
    const now = Date.now();
    const delta = (now - lastTime) / 1000;
    const rate = frames / delta;
    document.getElementById('rate').textContent = rate.toFixed(1);
    frames = 0;
    lastTime = now;
}, 1000);

document.getElementById('btn').onclick = async () => {
    try {
        addLog("Scanning for ESP32 (KLAP-GPS-10HZ)...");
        const device = await navigator.bluetooth.requestDevice({ 
            filters: [{ services: [S_UUID] }] 
        });
        
        addLog("Device found. Connecting...");
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(S_UUID);
        const char = await service.getCharacteristic(C_UUID);

        addLog("Connected! Subscribing to notifications...");
        
        char.addEventListener('characteristicvaluechanged', (e) => {
            const d = e.target.value; // DataView
            recvCount++;
            frames++;
            
            // UI更新
            document.getElementById('count').textContent = recvCount;
            const pulse = document.getElementById('pulse');
            pulse.classList.add('active');
            setTimeout(() => pulse.classList.remove('active'), 40);

            if (d.byteLength >= 13) {
                // Little Endianで解析
                const latInt = d.getInt32(0, true);
                const lngInt = d.getInt32(4, true);
                const speed = d.getUint16(8, true);
                const temp = d.getUint8(10);
                const hz = d.getUint16(11, true);

                // GPS座標の表示切り替え
                if (latInt === 0) {
                    document.getElementById('pos').textContent = "WAITING FOR FIX...";
                    document.getElementById('pos').style.color = "#f00";
                } else {
                    document.getElementById('pos').textContent = (latInt/1000000).toFixed(6) + ", " + (lngInt/1000000).toFixed(6);
                    document.getElementById('pos').style.color = "#fff";
                }
                
                document.getElementById('speed').textContent = speed;
                document.getElementById('temp').textContent = temp;
                document.getElementById('hz').textContent = hz;
                document.getElementById('rpm').textContent = hz * 60;
            }
        });

        await char.startNotifications();
        addLog("Diagnosis started at 10Hz.");
        document.getElementById('btn').style.background = "#050";
        document.getElementById('btn').textContent = "CONNECTED";
    } catch (e) {
        addLog("ERROR: " + e.message);
    }
};
</script>
</body>
</html>
