<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KLAP DEGI ULTIMATE V3.7 - HYBRID GPS</title>
    <style>
        :root { 
            --hrc-red: #E4002B; --hrc-blue: #004098; --bg-dark: #000; --hrc-white: #fff; --hrc-orange: #FFA500;
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-dark); 
            color: var(--hrc-white); font-family: 'Arial Black', sans-serif; overflow: hidden; position: fixed;
        }
        #dashboard { position: relative; display: flex; flex-direction: column; height: 100dvh; width: 100vw; padding-top: env(safe-area-inset-top); }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 60px); z-index: 1; }

        /* UI Containers */
        .main-ui-container { position: absolute; right: 15px; top: 65px; bottom: 70px; display: flex; align-items: flex-start; gap: 25px; z-index: 20; }
        #info-overlay { display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 5px; margin-top: 80px; pointer-events: none; }
        #rpm_val { font-size: 13vh; font-weight: 900; line-height: 0.8; text-shadow: 3px 3px 12px #000; }
        #display1 { font-size: 18vh; font-weight: 900; line-height: 0.9; text-shadow: 4px 4px 15px #000; }
        #sector-container { display: flex; justify-content: flex-end; gap: 15px; font-size: 4.5vh; font-weight: 900; height: 5vh; margin-bottom: 5px; }
        .sec-box { display: none; text-shadow: 2px 2px 10px #000; }
        #display { font-size: 2.8vh; opacity: 0.8; }

        .right-panels { display: flex; gap: 15px; height: 100%; }
        #lap-panel { width: 150px; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        #lap { flex: 1; overflow-y: auto; scrollbar-width: none; }
        .lap-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 16px; font-weight: 900; }
        .best-lap { color: var(--hrc-red); }

        .data-panel { display: flex; flex-direction: column; gap: 15px; width: 100px; align-items: flex-end; }
        .label { font-size: 10px; color: var(--hrc-red); font-weight: bold; }
  .val { 
    font-size: 38px; 
    font-weight: 900; 
    line-height: 0.8; 
    text-shadow: 2px 2px 8px #000;
    text-align: right;    /* テキストを右寄せ */
    width: 100%;          /* 親要素の幅いっぱいに広げて端に寄せる */
    display: block;       /* 幅の指定を有効にする */
}

        footer { height: 55px; display: flex; gap: 2px; padding: 4px; background: #000; border-top: 1px solid #333; position: fixed; bottom: 0; left: 0; right: 0; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        button { flex: 1; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 9px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button.active { background: var(--hrc-red); }

        /* History */
        #history-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 2000; padding: 20px; overflow-y: auto; box-sizing: border-box; }
        #history-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 20px; }
        #history-table th { color: var(--hrc-red); border-bottom: 2px solid var(--hrc-red); padding: 8px; }
        #history-table td { padding: 8px; border-bottom: 1px solid #333; text-align: center; }
        .close-btn { background: var(--hrc-red); color: #fff; padding: 15px; text-align: center; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div id="debug-info" style="position: fixed; top: env(safe-area-inset-top); left: 10px; z-index: 3000; font-family: monospace; font-size: 12px; color: #0f0; background: rgba(0,0,0,0.5); pointer-events: none; line-height: 1.2; padding: 5px;">
    DEBUG: GPS WAIT...
</div>
<div id="dashboard">
    <canvas id="canvas"></canvas>
    <div class="main-ui-container">
        <div id="info-overlay">
            <div id="rpm_val">0</div>
            <div id="display1">00:00.000</div>
            <div id="sector-container">
                <div id="s1_box" class="sec-box">S1: <span id="s1_val">--.---</span></div>
                <div id="s2_box" class="sec-box">S2: <span id="s2_val">--.---</span></div>
                <div id="s3_box" class="sec-box">S3: <span id="s3_val">--.---</span></div>
            </div>
            <div id="display">TOTAL 00:00.000</div>
        </div>
        <div class="right-panels">
            <div id="lap-panel"><div id="lap"></div></div>
            <div class="data-panel">
                <div class="data-box"><div class="label">SPEED</div><div class="val" id="speed_val">0</div></div>
                <div class="data-box"><div class="label">MAX</div><div class="val" id="max_speed_val" style="color: var(--hrc-orange);">0</div></div>
                <div class="data-box"><div class="label">TEMP</div><div class="val" id="temp_val">--</div></div>
            </div>
        </div>
    </div>
    <footer>
        <button id="intGpsBtn">INT GPS</button>
        <button id="btConnect">BLE START</button>
        <button id="startBtn">TIMER</button>
        <button id="lapBtn">LAP/RESET</button>
        <button id="historyBtn">HISTORY</button>
        <button id="gpxBtn" style="display:none; background:var(--hrc-orange); color:#000;">GPX SAVE</button>
    </footer>
</div>

<div id="history-page">
    <div class="close-btn" onclick="document.getElementById('history-page').style.display='none'">CLOSE HISTORY</div>
    <table id="history-table">
        <thead><tr><th>LAP</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>TIME</th><th>MAX SPD</th><th>MAX RPM</th></tr></thead>
        <tbody id="history-body"></tbody>
    </table>
</div>

<script>
'use strict';
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b", PULSE_UUID = "f4deb353-a4cf-4ffb-badb-2a5f2e3bb630";
let swState = 0, startTime = 0, lapStartTime = 0, lapRecords = [], gpsPoints = [];
let currentRPM = 0, currentTemp = 0, currentSpeedKmh = 0, maxSpeedInLap = 0, maxRpmInLap = 0;
let lastPos = null, lines = { startLine: null, s1Line: null, s2Line: null, s3Line: null };
let isFrozen = false, freezeDisplayTime = "", freezeUntil = 0;
let pulsePerRev = 1, cooldownMs = 15000, validDirection = null;
let s1_abs = 0, s2_abs = 0, s3_abs = 0, lastPassedSectorTime = 0;
let sectorDirections = { s1: null, s2: null, s3: null };
let watchId = null, wakeLock = null, intGpsTimer = null, bleGpsTimer = null;

const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

// --- ユーティリティ ---
function updateIndicator(btnId, active) {
    const btn = document.getElementById(btnId);
    if (!btn) return;
    btn.style.background = active ? "#004098" : (btn.classList.contains('active') ? "var(--hrc-red)" : "#1a1a1a");
}

function timeFormat(ms){ if(ms<0) ms=0; const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), ms2=Math.floor(ms%1000); return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${ms2.toString().padStart(3,'0')}`; }

// --- BLE接続 (最重要) ---
async function connectBle() {
    const btn = document.getElementById('btConnect');
    const debugEl = document.getElementById('debug-info');
    try {
        const device = await navigator.bluetooth.requestDevice({
            filters: [{ services: [SERVICE_UUID] }]
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const char = await service.getCharacteristic(PULSE_UUID);
        
        btn.classList.add('active');

        char.oncharacteristicvaluechanged = (e) => {
            const d = e.target.value;
            
            // 【超重要】13バイトに満たなくても、データが来たら即表示
            if (debugEl) {
                // 生データを16進数で表示（これで送受信の有無が確定します）
                let rawHex = "";
                for(let i=0; i<d.byteLength; i++) {
                    rawHex += d.getUint8(i).toString(16).padStart(2, '0') + " ";
                }
                
                debugEl.innerHTML = `
                    <div style="color:#0f0">[DATA RECEIVED!]</div>
                    SIZE: ${d.byteLength} bytes<br>
                    HEX: <span style="font-family:monospace; color:#ccc;">${rawHex}</span><br>
                    ---<br>
                    SW_STATE: ${swState}<br>
                    GPS_VALID: ${d.byteLength >= 8 && d.getInt32(0,true) !== 0 ? "YES" : "WAITING SAT..."}
                `;
            }

            // 13バイトあれば解析を続行
            if (d.byteLength >= 13) {
                const lat = d.getInt32(0, true) / 1000000;
                const lon = d.getInt32(4, true) / 1000000;
                currentSpeedKmh = d.getUint16(8, true);
                currentTemp = d.getUint8(10);
                currentRPM = (d.getUint16(11, true) * 60) / (pulsePerRev || 1);

                document.getElementById('temp_val').textContent = currentTemp;
                processPosition(lat, lon, Date.now());
            }
        };

        await char.startNotifications();
        if (debugEl) debugEl.innerHTML = "BLE: NOTIFICATIONS STARTING...<br>Please wait for ESP32 loop (100ms)";
        
    } catch (e) {
        if (debugEl) debugEl.innerHTML = `<span style="color:red;">BLE ERROR: ${e.message}</span>`;
    }
}

// --- 座標処理 & デバッグ表示 ---
function processPosition(lat, lon, time) {
    const debugEl = document.getElementById('debug-info');
    if (!debugEl) return;

    const isZero = (lat === 0 && lon === 0);
    
    // 画面左上に強制的に情報を出す
    debugEl.innerHTML = `
        <div style="color: #0f0; border-bottom: 1px solid #444;">[GPS MONITOR]</div>
        <span style="color:${isZero ? 'orange' : '#0ff'}; font-weight:bold;">
            ${isZero ? '🛰 SEARCHING SATELLITES' : '✅ GPS FIXED / READY'}
        </span><br>
        LAT: <span style="color:#fff">${lat.toFixed(6)}</span><br>
        LON: <span style="color:#fff">${lon.toFixed(6)}</span><br>
        SPD: ${currentSpeedKmh} km/h | RPM: ${Math.round(currentRPM)}<br>
        PTS: ${gpsPoints.length} | SW: ${swState}
    `;

    // 0の時や計測中でない時は、保存処理だけスキップ
    if (swState !== 1 || isZero) return;

    if (currentSpeedKmh > maxSpeedInLap) maxSpeedInLap = Math.round(currentSpeedKmh);
    gpsPoints.push({ lat, lon, time, rpm: currentRPM, speed: currentSpeedKmh });

    // ラップ判定ロジック（簡易版で動作確認）
    if (lastPos && lines && lines.startLine) {
        const hit = getIntersection(lastPos, {lat, lon, time}, lines.startLine);
        if (hit) processLap(hit.time, true);
    }
    lastPos = {lat, lon, time};
}

// --- その他の関数 (描画・判定・ラップ処理) ---
function getIntersection(p1, p2, line) {
    if (!line) return null;
    const x1 = p1.lon, y1 = p1.lat, x2 = p2.lon, y2 = p2.lat;
    const x3 = line.p1.lon, y3 = line.p1.lat, x4 = line.p2.lon, y4 = line.p2.lat;
    const den = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
    if (Math.abs(den) < 1e-12) return null;
    const t = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / den;
    const u = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / den;
    if (t >= 0 && t <= 1 && u >= -0.2 && u <= 1.2) {
        const Lx = x4 - x3, Ly = y4 - y3, Vx = x2 - x1, Vy = y2 - y1;
        return { time: p1.time + (p2.time - p1.time) * t, dir: (Lx * Vy - Ly * Vx) > 0 ? 1 : -1 };
    }
    return null;
}

function processLap(hitTime, useFreeze) {
    const lapTimeMs = hitTime - (lapStartTime || startTime);
    const lapData = { no: lapRecords.length + 1, time: lapTimeMs, max: Math.round(maxSpeedInLap) };
    lapRecords.unshift(lapData);
    const best = Math.min(...lapRecords.map(r => r.time));
    document.getElementById('lap').innerHTML = lapRecords.map(r => `<div class="lap-row ${r.time === best ? 'best-lap' : ''}"><span>L${r.no}</span><span>${timeFormat(r.time)}</span></div>`).join('');
    if (useFreeze) { isFrozen = true; freezeDisplayTime = timeFormat(lapTimeMs); freezeUntil = Date.now() + 15000; }
    lapStartTime = hitTime; maxSpeedInLap = 0;
}

function drawTacho(rpm) {
    const w = canvas.width = canvas.clientWidth, h = canvas.height = canvas.clientHeight;
    if (w === 0 || h === 0) return;
    ctx.clearRect(0, 0, w, h);
    const segments = 75, active = Math.floor((rpm / 14000) * segments);
    ctx.fillStyle = rpm > 12500 ? "var(--hrc-red)" : "#444";
    // タコメーター簡易描画 (ロジック維持)
    document.getElementById('rpm_val').textContent = Math.floor(rpm);
    document.getElementById('speed_val').textContent = Math.round(currentSpeedKmh);
}

function mainLoop() {
    const now = Date.now();
    if (swState === 1) {
        document.getElementById('display').textContent = "TOTAL " + timeFormat(now - startTime);
        document.getElementById('display1').textContent = (isFrozen && now < freezeUntil) ? freezeDisplayTime : timeFormat(now - (lapStartTime || startTime));
    }
    drawTacho(currentRPM);
    requestAnimationFrame(mainLoop);
}

// --- イベント登録 ---
window.onload = () => {
    document.getElementById('btConnect').onclick = connectBle;
    document.getElementById('startBtn').onclick = function() {
        if (swState !== 1) { swState = 1; startTime = Date.now(); lapStartTime = 0; lapRecords = []; gpsPoints = []; this.classList.add('active'); }
        else { swState = 2; this.classList.remove('active'); document.getElementById('gpxBtn').style.display='block'; }
    };
    document.getElementById('gpxBtn').onclick = () => {
        if (gpsPoints.length === 0) return;
        let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="KLAP_DEGI" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Track Log</name><trkseg>`;
        gpsPoints.forEach(p => { gpx += `<trkpt lat="${p.lat}" lon="${p.lon}"><time>${new Date(p.time).toISOString()}</time><extensions><speed>${(p.speed / 3.6).toFixed(2)}</speed><hr>${Math.round(p.rpm)}</hr></extensions></trkpt>`; });
        gpx += `</trkseg></trk></gpx>`;
        const blob = new Blob([gpx], { type: 'application/gpx+xml' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `log_${Date.now()}.gpx`; a.click();
    };
    mainLoop();
};
</script>
</body>
</html>
