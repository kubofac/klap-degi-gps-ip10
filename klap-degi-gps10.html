<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>KLAP DEGI V3.8 - ULTIMATE GUARD</title>
    <style>
        :root { 
            --hrc-red: #E4002B; --hrc-blue: #004098; --hrc-white: #ffffff; 
            --bg-dark: #000000; --hrc-orange: #FFA500; 
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-dark); 
            color: var(--hrc-white); font-family: 'Arial Black', sans-serif; overflow: hidden; position: fixed; 
        }
        #dashboard { position: relative; display: flex; flex-direction: column; height: 100dvh; width: 100vw; padding-top: env(safe-area-inset-top); }
        #canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: calc(100% - 60px) !important; z-index: 1; }
        
        .main-ui-container {
            position: absolute; right: 10px; top: 70px; bottom: 65px; 
            display: flex; flex-direction: row; align-items: flex-start; gap: 15px; z-index: 20; pointer-events: none;
        }
        #info-overlay { display: flex; flex-direction: column; align-items: flex-end; text-align: right; justify-content: center; margin-top: 40px;}
        #rpm_val { font-size: 11vh; font-weight: 900; line-height: 0.8; text-shadow: 3px 3px 10px #000; }
        #display1 { font-size: 17vh; letter-spacing: -2px; transform: scaleX(0.95); transform-origin: right; font-weight: 900; line-height: 0.9; text-shadow: 4px 4px 15px #000; }
        
        #sector-container { display: flex; justify-content: flex-end; gap: 10px; font-size: 3.5vh; font-weight: 900; margin-top: 5px; }
        .sec-box { display: none; color: #555; text-shadow: 2px 2px 5px #000; }
        .sec-active { color: #fff; }

        #display { font-size: 3vh; color: #888; margin-top: 5px; }
        
        .right-panels { display: flex; gap: 15px; height: 100%; align-items: flex-start; pointer-events: auto;}
        #lap-panel { width: 130px; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        #lap { flex: 1; overflow-y: auto; scrollbar-width: none; }
        #lap::-webkit-scrollbar { display: none; }
        .lap-row { display: flex; justify-content: flex-end; gap: 10px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 15px; font-weight: 900; }
        .best-lap { color: var(--hrc-red); }

        .data-panel { display: flex; flex-direction: column; gap: 12px; width: 85px; }
        .data-box { display: flex; flex-direction: column; align-items: flex-end; }
        .label { font-size: 10px; color: var(--hrc-red); font-weight: bold; }
        .val { font-size: 32px; font-weight: 900; line-height: 0.9; }

        footer { height: 50px; display: flex; gap: 3px; padding: 4px; background: #000; border-top: 1px solid #333; z-index: 100; position: fixed; bottom: 0; left: 0; right: 0; padding-bottom: env(safe-area-inset-bottom); }
        button { flex: 1; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 9px; font-weight: bold; cursor: pointer; }
        button.active { background: var(--hrc-red) !important; }
        #gpxBtn { background: var(--hrc-orange); color: #000; display: none; }

        #history-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 2000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
        #history-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 15px; }
        #history-table th { color: var(--hrc-red); border-bottom: 2px solid var(--hrc-red); padding: 8px; }
        #history-table td { padding: 8px; border-bottom: 1px solid #333; text-align: center; }
        .close-btn { background: var(--hrc-red); color: white; padding: 12px; text-align: center; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div id="dashboard">
    <canvas id="canvas"></canvas>
    <div class="main-ui-container">
        <div id="info-overlay">
            <div id="rpm_val">0</div>
            <div id="display1">00:00.000</div>
            <div id="sector-container">
                <div id="s1_box" class="sec-box">S1: <span id="s1_val">--.---</span></div>
                <div id="s2_box" class="sec-box">S2: <span id="s2_val">--.---</span></div>
                <div id="s3_box" class="sec-box">S3: <span id="s3_val">--.---</span></div>
            </div>
            <div id="display">TOTAL 00:00.000</div>
        </div>
        <div class="right-panels">
            <div id="lap-panel"><div id="lap"></div></div>
            <div class="data-panel">
                <div class="data-box"><div class="label">SPEED</div><div class="val" id="speed_val">0</div></div>
                <div class="data-box"><div class="label">MAX</div><div class="val" id="max_speed_val" style="color:var(--hrc-orange);">0</div></div>
                <div class="data-box"><div class="label">TEMP</div><div class="val" id="temp_val">--</div></div>
            </div>
        </div>
    </div>
    <footer>
        <button id="btConnect">BLE START</button>
        <button id="startBtn">TIMER</button>
        <button id="lapBtn">LAP/RESET</button>
        <button id="historyBtn">HISTORY</button>
        <button id="gpxBtn">GPX SAVE</button>
        <button id="reloadBtn" onclick="location.reload()">RELOAD</button>
    </footer>
</div>

<div id="history-page">
    <div class="close-btn" onclick="document.getElementById('history-page').style.display='none'">CLOSE HISTORY</div>
    <table id="history-table">
        <thead><tr><th>LAP</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>TIME</th><th>MAX SPD</th></tr></thead>
        <tbody id="history-body"></tbody>
    </table>
</div>

<script>
'use strict';
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b", PULSE_UUID = "f4deb353-a4cf-4ffb-badb-2a5f2e3bb630";
let swState = 0, startTime = 0, lapStartTime = 0, lapRecords = [], gpsLog = [];
let currentRPM = 0, currentTemp = 0, currentSpeedKmh = 0, maxSpeed = 0, lastPos = null;
let lat = 0, lon = 0, isFrozen = false, freezeDisplayTime = "", freezeUntil = 0;
let lines = { startLine: null, s1Line: null, s2Line: null, s3Line: null };
let s1_abs = 0, s2_abs = 0, s3_abs = 0, lastPassedSectorTime = 0;
let validDir = null, sectorDirs = { s1: null, s2: null, s3: null };
let nextExpectedSector = 's1'; 
let pulsePerRev = 1, cooldownMs = 15000;

const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

function init() {
    ['startLine', 's1Line', 's2Line', 's3Line'].forEach(key => {
        const p1lat = localStorage.getItem(key + 'P1Lat');
        if (p1lat) {
            lines[key] = {
                p1: { lat: parseFloat(p1lat), lon: parseFloat(localStorage.getItem(key + 'P1Lon')) },
                p2: { lat: parseFloat(localStorage.getItem(key + 'P2Lat')), lon: parseFloat(localStorage.getItem(key + 'P2Lon')) }
            };
            const boxId = key.replace('Line', '') + '_box';
            if (document.getElementById(boxId)) document.getElementById(boxId).style.display = 'block';
        }
    });
    pulsePerRev = parseFloat(localStorage.getItem('pl1')) || 1;
    cooldownMs = parseInt(localStorage.getItem('lapCoolDownTime')) || 10000;
}

function checkLineCross(p1, p2, line) {
    if (!line) return null;
    const x1 = p1.lon, y1 = p1.lat, x2 = p2.lon, y2 = p2.lat;
    const x3 = line.p1.lon, y3 = line.p1.lat, x4 = line.p2.lon, y4 = line.p2.lat;
    const den = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
    if (Math.abs(den) < 1e-12) return null;
    const t = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / den;
    const u = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / den;
    if (t >= 0 && t <= 1 && u >= -0.15 && u <= 1.15) {
        const cp = ((x4-x3)*(y2-y1)) - ((y4-y3)*(x2-x1));
        return { time: p1.time + (p2.time - p1.time) * t, dir: cp > 0 ? 1 : -1 };
    }
    return null;
}

async function bleConnect() {
    try {
        // 1. BLEデバイスの検索と接続
        const device = await navigator.bluetooth.requestDevice({ 
            filters: [{ services: [SERVICE_UUID] }] 
        });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const char = await service.getCharacteristic(PULSE_UUID);
        
        const btn = document.getElementById('btConnect');
        
        // 2. 通知（データ受信）の開始
        await char.startNotifications();
        this.classList.add('active'); // ボタンをアクティブ状態に
        
        // 3. データ受信イベント
        char.oncharacteristicvaluechanged = (e) => {
            const d = e.target.value;
            const now = Date.now();

            // データパケットの解析 (ESP32側の構造に合わせる)
            // 0-3:lat, 4-7:lon, 8-9:spd, 10:temp, 11-12:rpm と想定
            if (d.byteLength >= 13) {
                lat = d.getInt32(0, true) / 1000000;
                lon = d.getInt32(4, true) / 1000000;
                currentSpeedKmh = d.getUint16(8, true);
                currentTemp = d.getUint8(10);
                currentRPM = (d.getUint16(11, true) * 60) / pulsePerRev;

                // --- 【ステータス表示ロジック】 ---
                if (lat !== 0 && lon !== 0) {
                    // GPS測位完了: 赤背景 (GPX記録可能)
                    btn.style.backgroundColor = "var(--hrc-red)";
                    btn.style.color = "#fff";
                    btn.textContent = "GPX FIXED";
                } else {
                    // BLE接続のみ/GPS捕捉待ち: オレンジ背景
                    btn.style.backgroundColor = "var(--hrc-orange)";
                    btn.style.color = "#000";
                    btn.textContent = "WAITING GPS";
                }

                // リアルタイム表示の更新
                document.getElementById('temp_val').textContent = currentTemp;
                if (currentRPM > maxRpmInLap) maxRpmInLap = Math.round(currentRPM);

                // --- 【走行データ記録 & 判定ロジック】 ---
                if (swState === 1) { // TIMERが動いている時
                    if (currentSpeedKmh > maxSpeedInLap) maxSpeedInLap = Math.round(currentSpeedKmh);

                    // GPSが有効な場合のみログ保存とライン判定を実行
                    if (lat !== 0 && lon !== 0) {
                        const curPos = { lat: lat, lon: lon, time: now };
                        
                        // GPX保存用のログ配列に V10.6.1 互換形式で追加
                        gpsLog.push({ 
                            ...curPos, 
                            rpm: Math.round(currentRPM), 
                            spd: currentSpeedKmh,
                            temp: currentTemp 
                        });

                        // 前回座標がある場合、ライン通過判定を行う
                        if (lastPos) {
                            // 1. スタート/ゴールライン判定
                            const hitSL = getIntersection(lastPos, curPos, lines.startLine);
                            if (hitSL) {
                                // 初回通過時に通過方向(validDirection)を自動記憶
                                if (validDirection === null) validDirection = hitSL.dir;

                                // 方向が一致し、かつクールダウン経過後ならラップ確定
                                if (hitSL.dir === validDirection && (hitSL.time - (lapStartTime || startTime) > cooldownMs)) {
                                    processLap(hitSL.time);
                                }
                            }

                            // 2. セクター判定 (S1〜S3)
                            if (lapStartTime > 0) {
                                ['s1', 's2', 's3'].forEach(s => {
                                    const hit = getIntersection(lastPos, curPos, lines[s + 'Line']);
                                    if (hit) {
                                        // セクターごとの方向記憶
                                        if (sectorDirections[s] === null) sectorDirections[s] = hit.dir;

                                        if (hit.dir === sectorDirections[s]) {
                                            const absTime = (hit.time - lapStartTime) / 1000;
                                            // 各セクターの絶対時刻を記録して表示更新
                                            if (s === 's1' && s1_abs === 0) {
                                                s1_abs = absTime; lastPassedSectorTime = absTime;
                                                document.getElementById('s1_val').textContent = s1_abs.toFixed(3);
                                            } else if (s === 's2' && s2_abs === 0) {
                                                s2_abs = absTime; lastPassedSectorTime = absTime;
                                                document.getElementById('s2_val').textContent = (s1_abs > 0 ? (s2_abs - s1_abs) : s2_abs).toFixed(3);
                                            } else if (s === 's3' && s3_abs === 0) {
                                                s3_abs = absTime; lastPassedSectorTime = absTime;
                                                document.getElementById('s3_val').textContent = (s2_abs > 0 ? (s3_abs - s2_abs) : s3_abs).toFixed(3);
                                            }
                                        }
                                    }
                                });
                            }
                        }
                        lastPos = curPos; // 次回判定用に座標を保存
                    }
                }
            }
        };

        // 接続成功時の初期表示
        btn.style.backgroundColor = "var(--hrc-orange)";
        btn.style.color = "#000";
        btn.textContent = "CONNECTED";

    } catch (e) { 
        console.error("BLE Connection Error:", e);
        this.classList.remove('active');
        alert("BLE接続に失敗しました: " + e.message); 
    }
}

function updateSector(id, val) {
    const el = document.getElementById(id + '_val');
    el.textContent = val.toFixed(3);
    el.parentElement.classList.add('sec-active');
}

function processLap(hitTime, isAuto) {
    const lapTimeMs = hitTime - (lapStartTime || startTime);
    const s4 = lastPassedSectorTime > 0 ? (lapTimeMs/1000 - lastPassedSectorTime).toFixed(3) : "--.---";
    const data = {
        no: lapRecords.length + 1, time: lapTimeMs, max: maxSpeed,
        s1: document.getElementById('s1_val').textContent,
        s2: document.getElementById('s2_val').textContent,
        s3: document.getElementById('s3_val').textContent, s4: s4
    };
    lapRecords.unshift(data);
    if (isAuto) { isFrozen = true; freezeDisplayTime = timeFormat(lapTimeMs); freezeUntil = Date.now() + 8000; }
    const best = Math.min(...lapRecords.map(r => r.time));
    document.getElementById('lap').innerHTML = lapRecords.map(r => `
        <div class="lap-row ${r.time === best ? 'best-lap' : ''}">
            <span>L${r.no}</span><span>${timeFormat(r.time)}</span>
        </div>`).join('');
    lapStartTime = hitTime; maxSpeed = 0;
    s1_abs = 0; s2_abs = 0; s3_abs = 0; lastPassedSectorTime = 0;
    setTimeout(() => {
        ['s1_val','s2_val','s3_val'].forEach(id => document.getElementById(id).textContent = "--.---");
        document.querySelectorAll('.sec-box').forEach(el => el.classList.remove('sec-active'));
    }, 3000);
}

function saveGPX() {
    if (gpsLog.length === 0) return;
    let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="KLAP_DEGI" xmlns="http://www.topografix.com/GPX/1/1"><trk><trkseg>`;
    gpsLog.forEach(p => {
        gpx += `<trkpt lat="${p.lat}" lon="${p.lon}"><time>${new Date(p.time).toISOString()}</time><speed>${(p.spd/3.6).toFixed(2)}</speed></trkpt>`;
    });
    gpx += `</trkseg></trk></gpx>`;
    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `RaceLog_${Date.now()}.gpx`; a.click();
}

function tick() {
    const now = Date.now();
    if (swState === 1) {
        document.getElementById('display').textContent = "TOTAL " + timeFormat(now - startTime);
        const d1 = document.getElementById('display1');
        if (isFrozen && now < freezeUntil) { d1.textContent = freezeDisplayTime; d1.style.color = "var(--hrc-orange)"; }
        else { isFrozen = false; d1.textContent = timeFormat(now - (lapStartTime || startTime)); d1.style.color = "var(--hrc-white)"; }
    }
    drawTacho(currentRPM);
    document.getElementById('speed_val').textContent = currentSpeedKmh;
    document.getElementById('max_speed_val').textContent = maxSpeed;
    document.getElementById('temp_val').textContent = currentTemp;
    requestAnimationFrame(tick);
}

function drawTacho(rpm) {
    const w = canvas.width = canvas.clientWidth, h = canvas.height = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const segments = 75, active = Math.floor((rpm / 14000) * segments);
    const sX = 20, hY = 40, bY = h - 10, rad = bY - hY, curveEnd = 30;
    for (let i = 0; i <= segments; i++) {
        let x, y, ang, prog;
        if (i <= curveEnd) {
            prog = i / curveEnd; ang = Math.PI + (prog * (Math.PI / 2));
            x = sX + rad + Math.cos(ang) * rad; y = bY + Math.sin(ang) * rad;
        } else {
            prog = (i - curveEnd) / (segments - curveEnd);
            x = (sX + rad) + (prog * (w - (sX + rad) - 40)); y = hY; ang = 1.5 * Math.PI;
        }
        if (i < segments) {
            ctx.fillStyle = i < active ? ((i/segments*14000 > 12000) ? "var(--hrc-red)" : "#fff") : "#222";
            ctx.save(); ctx.translate(x, y); ctx.rotate(ang + Math.PI / 2);
            ctx.fillRect(-2, -15, 4, 30); ctx.restore();
        }
    }
    document.getElementById('rpm_val').textContent = Math.floor(rpm);
}

document.getElementById('btConnect').onclick = bleConnect;
document.getElementById('startBtn').onclick = function() {
    if (swState !== 1) {
        swState = 1; startTime = Date.now(); lapStartTime = 0; lapRecords = []; gpsLog = [];
        maxSpeed = 0; validDir = null; this.classList.add('active');
        document.getElementById('gpxBtn').style.display = 'none';
    } else {
        swState = 2; this.classList.remove('active');
        document.getElementById('gpxBtn').style.display = 'block';
    }
};
document.getElementById('lapBtn').onclick = () => {
    if (swState === 1) processLap(Date.now(), false);
    else if (confirm("RESET ALL?")) location.reload();
};
document.getElementById('historyBtn').onclick = () => {
    document.getElementById('history-body').innerHTML = lapRecords.map(r => `
        <tr><td>${r.no}</td><td>${r.s1}</td><td>${r.s2}</td><td>${r.s3}</td><td>${r.s4}</td><td>${timeFormat(r.time)}</td><td>${r.max}</td></tr>
    `).join('');
    document.getElementById('history-page').style.display = 'block';
};
document.getElementById('gpxBtn').onclick = () => {
    if (gpsLog.length === 0) {
        alert("保存する走行データがありません（GPS未捕捉またはタイマー未作動）。");
        return;
    }

    // --- A. ライン位置情報の抽出 (V10.6.1 互換) ---
    const getL = (k) => {
        const p1Lat = localStorage.getItem(k + 'P1Lat');
        if (!p1Lat) return "";
        return `${p1Lat},${localStorage.getItem(k + 'P1Lon')},${localStorage.getItem(k + 'P2Lat')},${localStorage.getItem(k + 'P2Lon')}`;
    };
    const lineData = `SL:${getL('startLine')}|S1:${getL('s1Line')}|S2:${getL('s2Line')}|S3:${getL('s3Line')}`;

    // --- B. GPXヘッダー構築 ---
    let gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="KLAP_DEGI_ULTIMATE" 
    xmlns="http://www.topografix.com/GPX/1/1" 
    xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1">
<metadata>
    <name>Race Session ${new Date().toLocaleString()}</name>
    <desc>LINE_DATA[${lineData}]</desc>
</metadata>
<trk>
  <name>Race Log</name>
  <trkseg>`;

    // --- C. 時刻の正規化 (V10.6.1 方式：2000年1月1日基準) ---
    const baseStartTime = gpsLog[0].time;

    gpsLog.forEach(p => {
        // 解析ソフトが同期しやすいよう 2000-01-01T00:00:00Z 基準の相対時刻に変換
        const relativeTime = new Date(946684800000 + (p.time - baseStartTime)).toISOString();
        const speedMS = (p.spd / 3.6).toFixed(2); // km/h -> m/s
        const rpm = Math.round(p.rpm || 0);
        const temp = p.temp || 0;

        gpx += `
    <trkpt lat="${p.lat}" lon="${p.lon}">
      <time>${relativeTime}</time>
      <speed>${speedMS}</speed>
      <extensions>
        <gpxtpx:TrackPointExtension>
          <gpxtpx:hr>${rpm}</gpxtpx:hr>
          <gpxtpx:atemp>${temp}</gpxtpx:atemp>
        </gpxtpx:TrackPointExtension>
      </extensions>
    </trkpt>`;
    });

    gpx += `
  </trkseg>
</trk>
</gpx>`;

    // --- D. ブラウザ互換ダウンロード処理 ---
    try {
        const blob = new Blob([gpx], { type: 'application/gpx+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `RaceLog_Ultimate_${Date.now()}.gpx`;
        document.body.appendChild(a);
        
        // iPhone/Safari等のポップアップブロック対策で遅延実行
        setTimeout(() => {
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }, 50);

        window.alert(`【解析ソフト互換形式】\n${gpsLog.length}地点のデータを保存しました。\n回転数(HR)・水温(TEMP)・速度・ライン情報が含まれています。`);
    } catch (e) {
        alert("保存エラー: " + e.message);
    }
};

function timeFormat(ms){
    const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000), mm = Math.floor(ms%1000);
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${mm.toString().padStart(3,'0')}`;
}

window.onload = () => { init(); tick(); };
</script>
</body>
</html>
