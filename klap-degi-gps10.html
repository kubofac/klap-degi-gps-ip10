<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>KLAP DEGI V4.6 - ULTIMATE</title>
<style>
    :root { 
        --hrc-red: #E4002B; --hrc-blue: #004098; --hrc-white: #ffffff; 
        --bg-dark: #000000; --hrc-orange: #FFA500; 
    }
    body, html { 
        margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-dark); 
        color: var(--hrc-white); font-family: 'Arial Black', sans-serif; overflow: hidden; position: fixed; 
    }
    #dashboard { position: relative; display: flex; flex-direction: column; height: 100dvh; width: 100vw; padding-top: env(safe-area-inset-top); }
    #canvas { position: absolute; top: 0; left: 0; width: 100% !important; height: calc(100% - 60px) !important; z-index: 1; }
    
    #debug-overlay { position: absolute; left: 10px; bottom: 65px; font-family: monospace; font-size: 10px; color: rgba(255, 255, 255, 0.4); z-index: 100; pointer-events: none; }

    .main-ui-container {
        position: absolute; right: 10px; top: 65px; bottom: 65px; 
        display: flex; flex-direction: row; align-items: flex-start; gap: 20px; z-index: 20; pointer-events: none;
    }
    #info-overlay { display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 5px; margin-top: 50px;}
    #rpm_val { font-size: 11vh; font-weight: 900; line-height: 0.8; text-shadow: 3px 3px 10px #000; }
    #display1 { font-size: 15vh; font-weight: 900; line-height: 0.9; text-shadow: 4px 4px 15px #000; white-space: nowrap; }
    
    #sector-container { display: flex; justify-content: flex-end; gap: 10px; font-size: 4vh; font-weight: 900; height: 4.5vh; margin-top: 5px; }
    .sec-box { display: none; text-shadow: 2px 2px 8px #000; color: #fff; }
    #display { font-size: 2.5vh; opacity: 0.8; margin-top: 5px; }

    .right-panels { display: flex; flex-direction: row; gap: 15px; height: 100%; align-items: flex-start; pointer-events: auto;}
    #lap-panel { width: 140px; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
    #lap { flex: 1; overflow-y: auto; scrollbar-width: none; }
    .lap-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 15px; font-weight: 900; }
    .best-lap { color: var(--hrc-red) !important; }

    .data-panel { display: flex; flex-direction: column; gap: 10px; width: 90px; }
    .data-box { display: flex; flex-direction: column; align-items: flex-end; }
    .label { font-size: 10px; color: var(--hrc-red); font-weight: bold; }
    .val { font-size: 32px; font-weight: 900; line-height: 0.9; }

    #history-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.98); z-index: 2000; padding: 20px; box-sizing: border-box; overflow-y: auto; }
    #history-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 15px; }
    #history-table th { color: var(--hrc-red); border-bottom: 2px solid var(--hrc-red); padding: 8px; }
    #history-table td { padding: 8px; border-bottom: 1px solid #333; text-align: center; }
    .close-btn { background: var(--hrc-red); color: white; padding: 15px; text-align: center; font-weight: bold; border-radius: 4px; cursor: pointer; }

    footer { height: 55px; display: flex; gap: 2px; padding: 3px; background: #000; border-top: 1px solid #333; z-index: 1000; position: fixed; bottom: 0; left: 0; right: 0; padding-bottom: env(safe-area-inset-bottom); }
    button { flex: 1; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 8px; font-weight: bold; cursor: pointer; }
    button.active { background: var(--hrc-red) !important; border: 1px solid #fff; }
</style>
</head>
<body>

<div id="dashboard">
    <canvas id="canvas"></canvas>
    
    <div id="debug-overlay">
        LAT:<span id="debug_lat">0.000</span> LON:<span id="debug_lon">0.000</span> PKT:<span id="debug_pkt">0</span>
    </div>

    <div class="main-ui-container">
        <div id="info-overlay">
            <div id="rpm_val">0</div>
            <div id="display1">00:00.000</div>
            <div id="sector-container">
                <div id="s1_box" class="sec-box">S1: <span id="s1_val">--.---</span></div>
                <div id="s2_box" class="sec-box">S2: <span id="s2_val">--.---</span></div>
                <div id="s3_box" class="sec-box">S3: <span id="s3_val">--.---</span></div>
            </div>
            <div id="display">TOTAL 00:00.000</div>
        </div>
        <div class="right-panels">
            <div id="lap-panel"><div id="lap"></div></div>
            <div class="data-panel">
                <div class="data-box"><div class="label">SPEED</div><div class="val" id="speed_val">0</div></div>
                <div class="data-box"><div class="label">MAX</div><div class="val" id="max_speed_val" style="color:var(--hrc-orange);">0</div></div>
                <div class="data-box"><div class="label">TEMP</div><div class="val" id="temp_val">--</div></div>
            </div>
        </div>
    </div>

    <footer>
        <button id="intGpsBtn">INT GPS</button>
        <button id="btConnect">BLE START</button>
        <button id="startBtn">TIMER</button>
        <button id="lapBtn">LAP/RESET</button>
        <button id="historyBtn">HISTORY</button>
        <button id="gpxBtn" style="display:none; background:var(--hrc-orange); color:#000;">GPX SAVE</button>
        <button id="reloadBtn" onclick="location.reload()">RELOAD</button>
    </footer>
</div>

<div id="history-page">
    <div class="close-btn" onclick="document.getElementById('history-page').style.display='none'">CLOSE HISTORY</div>
    <table id="history-table">
        <thead><tr><th>LAP</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>TIME</th><th>MAX SPD</th></tr></thead>
        <tbody id="history-body"></tbody>
    </table>
</div>

<script>
'use strict';
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b", PULSE_UUID = "f4deb353-a4cf-4ffb-badb-2a5f2e3bb630";
let swState = 0, startTime = 0, lapStartTime = 0, lapRecords = [], gpsPoints = [], lastBleDataTime = 0;
let lat = 0, lon = 0, currentRPM = 0, currentTemp = 0, currentSpeedKmh = 0, maxSpeedInLap = 0;
let lastPos = null, isFrozen = false, freezeDisplayTime = "", freezeUntil = 0;
let lines = { startLine: null, s1Line: null, s2Line: null, s3Line: null };
let validDirection = null, sectorDirections = { s1: null, s2: null, s3: null };
let s1_abs = 0, s2_abs = 0, s3_abs = 0, lastPassedSectorTime = 0, watchId = null, wakeLock = null;
let pulsePerRev = 1, cooldownMs = 15000;

const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

function initLines() {
    ['startLine', 's1Line', 's2Line', 's3Line'].forEach(key => {
        const val = localStorage.getItem(key + 'P1Lat');
        if (val) {
            lines[key] = {
                p1: { lat: parseFloat(localStorage.getItem(key + 'P1Lat')), lon: parseFloat(localStorage.getItem(key + 'P1Lon')) },
                p2: { lat: parseFloat(localStorage.getItem(key + 'P2Lat')), lon: parseFloat(localStorage.getItem(key + 'P2Lon')) }
            };
            const boxId = key.replace('Line', '') + '_box';
            if (document.getElementById(boxId)) document.getElementById(boxId).style.display = 'block';
        }
    });
    pulsePerRev = parseFloat(localStorage.getItem('pl1')) || 1;
    cooldownMs = parseInt(localStorage.getItem('lapCoolDownTime')) || 15000;
}

function getIntersection(p1, p2, line) {
    if (!line) return null;
    const x1 = p1.lon, y1 = p1.lat, x2 = p2.lon, y2 = p2.lat;
    const x3 = line.p1.lon, y3 = line.p1.lat, x4 = line.p2.lon, y4 = line.p2.lat;
    const den = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
    if (Math.abs(den) < 1e-12) return null;
    const t = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / den;
    const u = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / den;
    if (t >= 0 && t <= 1 && u >= -0.2 && u <= 1.2) {
        const Lx = x4 - x3, Ly = y4 - y3, Vx = x2 - x1, Vy = y2 - y1;
        return { time: p1.time + (p2.time - p1.time) * t, dir: (Lx * Vy) - (Ly * Vx) > 0 ? 1 : -1 };
    }
    return null;
}

// 内部GPSトグル
async function toggleInternalGps() {
    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId); watchId = null;
        document.getElementById('intGpsBtn').classList.remove('active');
        if (wakeLock) { await wakeLock.release(); wakeLock = null; }
        return;
    }
    if ("wakeLock" in navigator) { try { wakeLock = await navigator.wakeLock.request("screen"); } catch(e){} }
    document.getElementById('intGpsBtn').classList.add('active');
    watchId = navigator.geolocation.watchPosition(pos => {
        const now = Date.now();
        currentSpeedKmh = pos.coords.speed ? pos.coords.speed * 3.6 : 0;
        lat = pos.coords.latitude; lon = pos.coords.longitude;
        document.getElementById('debug_lat').textContent = lat.toFixed(6);
        document.getElementById('debug_lon').textContent = lon.toFixed(6);
        handlePositionUpdate(lat, lon, now);
    }, e => alert(e.message), { enableHighAccuracy: true, maximumAge: 0 });
}

// BLE受信
async function ble() {
    try {
        const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const char = await service.getCharacteristic(PULSE_UUID);
        document.getElementById('btConnect').classList.add('active');
        
        char.addEventListener('characteristicvaluechanged', (e) => {
            const d = e.target.value; const now = Date.now(); lastBleDataTime = now;
            document.getElementById('debug_pkt').textContent = d.byteLength;
            if (d.byteLength >= 13) {
                lat = d.getInt32(0, true) / 1000000;
                lon = d.getInt32(4, true) / 1000000;
                currentSpeedKmh = d.getUint16(8, true);
                currentTemp = d.getUint8(10);
                currentRPM = (d.getUint16(11, true) * 60) / pulsePerRev;
                document.getElementById('debug_lat').textContent = lat.toFixed(6);
                document.getElementById('debug_lon').textContent = lon.toFixed(6);
                document.getElementById('temp_val').textContent = currentTemp;
                handlePositionUpdate(lat, lon, now);
            }
        });
        await char.startNotifications();
    } catch (e) { alert("BLE Error: " + e.message); }
}

// ★一本化した位置情報処理ロジック
function handlePositionUpdate(currLat, currLon, now) {
    if (currLat === 0 && currLon === 0) return;
    document.getElementById('speed_val').textContent = Math.round(currentSpeedKmh);
    
    if (swState === 1) {
        if (currentSpeedKmh > maxSpeedInLap) maxSpeedInLap = currentSpeedKmh;
        const cur = { lat: currLat, lon: currLon, time: now, rpm: currentRPM, speed: currentSpeedKmh };
        gpsPoints.push(cur);

        if (lastPos) {
            const hitSL = getIntersection(lastPos, cur, lines.startLine);
            if (hitSL) {
                if (validDirection === null) validDirection = hitSL.dir;
                if (hitSL.dir === validDirection && (hitSL.time - (lapStartTime || startTime) > cooldownMs)) {
                    processLap(hitSL.time, true);
                }
            }
            if (lapStartTime > 0) {
                ['s1', 's2', 's3'].forEach(s => {
                    const hit = getIntersection(lastPos, cur, lines[s + 'Line']);
                    if (hit) {
                        if (sectorDirections[s] === null) sectorDirections[s] = hit.dir;
                        if (hit.dir === sectorDirections[s]) {
                            const absT = (hit.time - lapStartTime) / 1000;
                            if (s === 's1' && s1_abs === 0) { s1_abs = absT; lastPassedSectorTime = absT; document.getElementById('s1_val').textContent = s1_abs.toFixed(3); }
                            else if (s === 's2' && s2_abs === 0) { s2_abs = absT; lastPassedSectorTime = absT; document.getElementById('s2_val').textContent = (s1_abs > 0 ? (s2_abs-s1_abs) : s2_abs).toFixed(3); }
                            else if (s === 's3' && s3_abs === 0) { s3_abs = absT; lastPassedSectorTime = absT; document.getElementById('s3_val').textContent = (s2_abs > 0 ? (s3_abs-s2_abs) : s3_abs).toFixed(3); }
                        }
                    }
                });
            }
        }
        lastPos = cur;
    }
}

function processLap(hitTime, useFreeze) {
    const lapTimeMs = hitTime - (lapStartTime || startTime);
    const s4 = lastPassedSectorTime > 0 ? ((lapTimeMs/1000) - lastPassedSectorTime).toFixed(3) : "--.---";
    const lapData = { no: lapRecords.length + 1, time: lapTimeMs, max: Math.round(maxSpeedInLap), s1: document.getElementById('s1_val').textContent, s2: document.getElementById('s2_val').textContent, s3: document.getElementById('s3_val').textContent, s4: s4 };
    lapRecords.unshift(lapData);
    updateLapList();
    if (useFreeze) { isFrozen = true; freezeDisplayTime = timeFormat(lapTimeMs); freezeUntil = Date.now() + 10000; }
    lapStartTime = hitTime; maxSpeedInLap = 0; s1_abs = 0; s2_abs = 0; s3_abs = 0; lastPassedSectorTime = 0;
    setTimeout(() => { if(swState===1) ['s1_val','s2_val','s3_val'].forEach(id => document.getElementById(id).textContent = "--.---"); }, 2000);
}

function updateLapList() {
    const best = Math.min(...lapRecords.map(r => r.time));
    document.getElementById('lap').innerHTML = lapRecords.map(r => `<div class="lap-row ${r.time === best && lapRecords.length > 1 ? 'best-lap' : ''}"><span>L${r.no}</span><span>${timeFormat(r.time)}</span></div>`).join('');
}

document.getElementById('historyBtn').onclick = () => {
    if (lapRecords.length === 0) return;
    const best = Math.min(...lapRecords.map(r => r.time));
    document.getElementById('history-body').innerHTML = lapRecords.map(r => `<tr style="${r.time === best ? 'background:rgba(228,0,43,0.1);' : ''}"><td>${r.no}</td><td>${r.s1}</td><td>${r.s2}</td><td>${r.s3}</td><td>${r.s4}</td><td style="${r.time===best?'color:var(--hrc-red);':''}">${timeFormat(r.time)}</td><td>${r.max}</td></tr>`).join('');
    document.getElementById('history-page').style.display = 'block';
};

// ★GPX保存ロジック（整理版）
document.getElementById('gpxBtn').onclick = () => {
    if (gpsPoints.length === 0) { alert("走行データがありません"); return; }
    try {
        let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="KLAP_DEGI" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>Log_${Date.now()}</name><trkseg>`;
        const base = gpsPoints[0].time;
        gpsPoints.forEach(p => {
            const relTime = new Date(946684800000 + (p.time - base)).toISOString();
            gpx += `<trkpt lat="${p.lat}" lon="${p.lon}"><time>${relTime}</time><speed>${(p.speed / 3.6).toFixed(2)}</speed></trkpt>`;
        });
        gpx += `</trkseg></trk></gpx>`;
        const blob = new Blob([gpx], { type: 'application/gpx+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `RaceLog_${Date.now()}.gpx`;
        document.body.appendChild(a); a.click();
        setTimeout(() => { document.body.removeChild(a); window.URL.revokeObjectURL(url); }, 500);
    } catch (e) { alert("GPX Error: " + e.message); }
};

function mainLoop() {
    const now = Date.now();
    if (swState === 1) {
        document.getElementById('display').textContent = "TOTAL " + timeFormat(now - startTime);
        document.getElementById('display1').textContent = (isFrozen && now < freezeUntil) ? freezeDisplayTime : timeFormat(now - (lapStartTime || startTime));
    }
    drawTacho(currentRPM);
    document.getElementById('max_speed_val').textContent = Math.round(maxSpeedInLap);
    requestAnimationFrame(mainLoop);
}

function drawTacho(rpm) {
    const w = canvas.width = canvas.clientWidth, h = canvas.height = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const segments = 75, active = Math.floor((rpm / 14000) * segments);
    const sX = 25, hY = 40, bY = h - 10, rad = bY - hY, curveEnd = 30;
    for (let i = 0; i <= segments; i++) {
        let x, y, ang, prog;
        if (i <= curveEnd) { prog = i / curveEnd; ang = Math.PI + (prog * (Math.PI / 2)); x = sX + rad + Math.cos(ang) * rad; y = bY + Math.sin(ang) * rad; }
        else { prog = (i - curveEnd) / (segments - curveEnd); x = (sX + rad) + (prog * (w - (sX + rad) - 40)); y = hY; ang = 1.5 * Math.PI; }
        if (i < segments) {
            ctx.fillStyle = i < active ? (((i/segments)*14000) >= 12500 ? "var(--hrc-red)" : (((i/segments)*14000) >= 8000 ? "var(--hrc-blue)" : "#fff")) : "#222";
            ctx.save(); ctx.translate(x, y); ctx.rotate(ang + Math.PI / 2);
            ctx.fillRect(-Math.max(4, w*0.012)/2, -Math.max(25, h*0.12)/2, Math.max(4, w*0.012), Math.max(25, h*0.12)); ctx.restore();
        }
    }
    document.getElementById('rpm_val').textContent = Math.floor(rpm);
}

function timeFormat(ms){ if(ms<0) ms=0; const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), ms2=Math.floor(ms%1000); return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${ms2.toString().padStart(3,'0')}`; }

document.getElementById('intGpsBtn').onclick = toggleInternalGps;
document.getElementById('btConnect').onclick = ble;
document.getElementById('startBtn').onclick = function() {
    if (swState !== 1) { 
        swState = 1; startTime = Date.now(); lapStartTime = 0; lapRecords = []; gpsPoints = []; lastPos = null; validDirection = null; 
        this.classList.add('active'); 
        document.getElementById('gpxBtn').style.display = 'none'; 
    } else { 
        swState = 2; 
        this.classList.remove('active'); 
        document.getElementById('gpxBtn').style.display = 'block'; 
    }
};
document.getElementById('lapBtn').onclick = () => { if (swState === 1) processLap(Date.now(), false); else if (confirm("RESET?")) location.reload(); };

window.onload = () => { initLines(); mainLoop(); };
</script>
</body>
</html>
