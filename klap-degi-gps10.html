<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KLAP DEGI V3.5 - DEBUG INTEGRATED</title>
<style>
    :root { 
        --hrc-red: #E4002B; --hrc-blue: #004098; --hrc-white: #ffffff; 
        --bg-dark: #000000; --hrc-orange: #FFA500; 
    }
    body, html { 
        margin: 0; padding: 0; width: 100%; height: 100%; background-color: var(--bg-dark); 
        color: var(--hrc-white); font-family: 'Arial Black', sans-serif; overflow: hidden; position: fixed; 
    }
    #dashboard { 
        position: relative; display: flex; flex-direction: column; height: 100dvh; width: 100vw; 
        padding-top: env(safe-area-inset-top); 
    }
    #canvas { 
        position: absolute; top: 0; left: 0; width: 100% !important; 
        height: calc(100% - 60px) !important; z-index: 1; 
    }
    
    /* デバッグ表示用レイヤー */
    #debug-overlay {
        position: absolute; left: 10px; bottom: 55px;
        font-family: monospace; font-size: 10px; color: rgba(255, 255, 255, 0.4);
        z-index: 100; pointer-events: none; line-height: 1.2;
    }
    #debug-overlay span { color: var(--hrc-orange); }

    .main-ui-container {
        position: absolute; right: 5px; top: 130px; bottom: 60px; 
        display: flex; flex-direction: row; align-items: flex-start; gap: 15px; z-index: 20; pointer-events: none;
    }
    #info-overlay { 
        display: flex; flex-direction: column; align-items: flex-end; text-align: right; 
        height: 100%; justify-content: center; 
    }
    #rpm_val { font-size: 11vh; font-weight: 900; line-height: 0.8; text-shadow: 3px 3px 10px #000; margin-bottom: 10px; }
    #display1 { 
        font-size: 17vh; letter-spacing: -2px; transform: scaleX(0.9); transform-origin: right; 
        font-weight: 900; line-height: 0.8; color: var(--hrc-white); text-shadow: 4px 4px 15px #000; white-space: nowrap; 
    }
    #display { font-size: 3.5vh; color: #bbb; text-shadow: 1px 1px 6px #000; margin-top: 5px; }
    
    #lap-panel { width: 130px; height: calc(100% - 20px); display: flex; flex-direction: column; overflow: hidden; padding-top: 10px; }
    #lap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    #lap::-webkit-scrollbar { display: none; }
    .lap-row { 
        display: flex; justify-content: flex-end; gap: 10px; padding: 5px 0; 
        border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 15px; font-weight: 900; 
    }
    .best-lap { color: var(--hrc-red); }
    
    .data-panel { display: flex; flex-direction: column; gap: 10px; width: 85px; padding-top: 10px; }
    .data-box { display: flex; flex-direction: column; align-items: flex-end; }
    .label { font-size: 10px; color: var(--hrc-red); font-weight: bold; }
    .val { font-size: 30px; font-weight: 900; line-height: 0.9; }

    footer { 
        height: 45px; display: flex; gap: 4px; padding: 3px; background: #000; border-top: 1px solid #333; 
        z-index: 10000; position: fixed; bottom: 0; left: 0; right: 0; 
        padding-bottom: env(safe-area-inset-bottom); pointer-events: auto;
    }
    button { 
        flex: 1; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 6px; 
        font-size: 10px; font-weight: bold; cursor: pointer; display: flex; align-items: center; 
        justify-content: center; height: 100%; 
    }
    button.active { border: 2px solid #fff; }
    #saveLogBtn { background: #155724; display: none; }
</style>
</head>
<body>

<div id="dashboard">
    <canvas id="canvas"></canvas>

    <div id="debug-overlay">
        <div>LAT: <span id="debug_lat">0.000000</span></div>
        <div>LON: <span id="debug_lon">0.000000</span></div>
        <div>PKT: <span id="debug_pkt">0</span> bytes</div>
    </div>

    <div class="main-ui-container">
        <div id="info-overlay">
            <div id="rpm_val">0</div>
            <div id="display1">00:00.000</div>
            <div id="display">TOTAL 00:00.000</div>
        </div>
        <div id="lap-panel"><div id="lap"></div></div>
        <div class="data-panel">
            <div class="data-box"><div class="label">SPEED</div><div class="val" id="speed_val">0</div></div>
            <div class="data-box"><div class="label">MAX</div><div class="val" id="max_speed_val" style="color:var(--hrc-orange);">0</div></div>
            <div class="data-box"><div class="label">TEMP</div><div class="val" id="temp_val">--</div></div>
        </div>
    </div>
    <footer>
        <button id="btConnect">BLE START</button>
        <button id="startBtn">TIMER</button>
        <button id="lapBtn">LAP/RESET</button>
        <button id="saveLogBtn">LOG SAVE</button>
        <button id="reloadBtn" onclick="location.reload()">RELOAD</button>
    </footer>
</div>

<script>
'use strict';

const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b", PULSE_UUID = "f4deb353-a4cf-4ffb-badb-2a5f2e3bb630";
let currentRPM = 0, currentTemp = 0, currentSpeedKmh = 0, maxSpeed = 0;
let lat = 0, lon = 0, lastLapTime = 0, lastBleDataTime = 0;
let swState = 0, startTime = 0, lapStartTime = 0, lapRecords = [], logData = [];
let isFrozen = false, freezeDisplayTime = "", freezeStartTime = 0;
let LAP_LINE_P1 = { lat: 0, lon: 0 }, LAP_LINE_P2 = { lat: 0, lon: 0 };
let detectedDirection = null, lastPos = null, lapCoolDown = 15000, wakeLock = null;

const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

function updateSettings() {
    const p1Lat = localStorage.getItem('startLineP1Lat'), p1Lon = localStorage.getItem('startLineP1Lon');
    const p2Lat = localStorage.getItem('startLineP2Lat'), p2Lon = localStorage.getItem('startLineP2Lon');
    if (p1Lat && p1Lon && p2Lat && p2Lon) {
        LAP_LINE_P1 = { lat: parseFloat(p1Lat), lon: parseFloat(p1Lon) };
        LAP_LINE_P2 = { lat: parseFloat(p2Lat), lon: parseFloat(p2Lon) };
        lapCoolDown = parseFloat(localStorage.getItem('lapCoolDownTime')) || 15000;
        return true;
    }
    return false;
}

function getIntersectionTime(p1, p2) {
    if (!LAP_LINE_P1.lat || !LAP_LINE_P2.lat) return null;
    const x1 = p1.lon, y1 = p1.lat, x2 = p2.lon, y2 = p2.lat;
    const x3 = LAP_LINE_P1.lon, y3 = LAP_LINE_P1.lat, x4 = LAP_LINE_P2.lon, y4 = LAP_LINE_P2.lat;
    const den = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
    if (Math.abs(den) < 1e-12) return null;
    const t = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / den; 
    const u = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / den; 
    if (t >= 0 && t <= 1) {
        const Lx = x4 - x3, Ly = y4 - y3, Vx = x2 - x1, Vy = y2 - y1;
        const crossProduct = (Lx * Vy) - (Ly * Vx);
        const currentMoveDir = crossProduct > 0 ? 1 : -1;
        if (detectedDirection === null) detectedDirection = currentMoveDir;
        if (currentMoveDir === detectedDirection && u >= -0.2 && u <= 1.2) {
            return p1.time + (p2.time - p1.time) * t; 
        }
    }
    return null;
}

async function ble() {
    try {
        if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
        const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const char = await service.getCharacteristic(PULSE_UUID);
        
        document.getElementById('btConnect').classList.add('active');

        char.addEventListener('characteristicvaluechanged', (e) => {
            const d = e.target.value;
            const now = Date.now();
            lastBleDataTime = now;
            
            // デバッグ出力
            document.getElementById('debug_pkt').textContent = d.byteLength;

            if (d.byteLength >= 13) {
                lat = d.getInt32(0, true) / 1000000;
                lon = d.getInt32(4, true) / 1000000;
                currentSpeedKmh = d.getUint16(8, true);
                currentTemp = d.getUint8(10);
                let rawHz = d.getUint16(11, true); 
                let pCount = parseInt(localStorage.getItem('pl1')) || 1;
                currentRPM = (rawHz * 60) / pCount;

                document.getElementById('speed_val').textContent = currentSpeedKmh;
                document.getElementById('temp_val').textContent = currentTemp;
                document.getElementById('debug_lat').textContent = lat.toFixed(6);
                document.getElementById('debug_lon').textContent = lon.toFixed(6);

                if (swState === 1) {
                    if (currentSpeedKmh > maxSpeed) maxSpeed = currentSpeedKmh;
                    const currentPos = { lat: lat, lon: lon, time: now };
                    if (lastPos && LAP_LINE_P1.lat !== 0) {
                        const exactTime = getIntersectionTime(lastPos, currentPos);
                        if (exactTime !== null) {
                            const timeSinceLastLap = exactTime - lastLapTime;
                            if (timeSinceLastLap >= lapCoolDown) processLap(exactTime, true);
                        }
                    }
                    lastPos = currentPos;
                    logData.push({ t: new Date().toISOString(), la: lat, lo: lon, sp: (currentSpeedKmh / 3.6).toFixed(2), r: Math.round(currentRPM) });
                }
            }
        });
        await char.startNotifications();
    } catch (e) { alert("BLE Error: " + e.message); }
}

function processLap(exactTime, isAuto) {
    const lapTime = exactTime - (lapStartTime || startTime);
    lastLapTime = exactTime; lapStartTime = exactTime; 
    lapRecords.unshift(lapTime);
    if (isAuto) { isFrozen = true; freezeDisplayTime = timeFormat(lapTime); freezeStartTime = Date.now(); }
    
    const bestTime = Math.min(...lapRecords);
    document.getElementById('lap').innerHTML = lapRecords.map((t, i) => {
        return `<div class="lap-row ${t === bestTime ? 'best-lap' : ''}"><span>L${lapRecords.length - i}</span><span>${timeFormat(t)}</span></div>`;
    }).join('');
    if (window.navigator.vibrate) window.navigator.vibrate([100, 50, 100]);
}

function updateButtonColors() {
    const now = Date.now();
    const btBtn = document.getElementById('btConnect');
    const isConnected = (lastBleDataTime !== 0 && (now - lastBleDataTime < 3000));
    if (isConnected) {
        btBtn.style.backgroundColor = "var(--hrc-red)"; btBtn.textContent = "BLE READY";
    } else {
        btBtn.style.backgroundColor = "#1a1a1a"; btBtn.textContent = "BLE START"; btBtn.classList.remove('active');
    }
    document.getElementById('startBtn').style.backgroundColor = (swState === 1) ? "var(--hrc-red)" : "#1a1a1a";
}
setInterval(updateButtonColors, 1000);

function tick() {
    const now = Date.now();
    if (swState === 1) {
        document.getElementById('display').textContent = "TOTAL " + timeFormat(now - startTime);
        const d1 = document.getElementById('display1');
        if (isFrozen) {
            d1.textContent = freezeDisplayTime;
            if (now - freezeStartTime > 10000) isFrozen = false;
        } else { d1.textContent = timeFormat(now - lapStartTime); }
    }
    drawTacho(currentRPM);
    document.getElementById('max_speed_val').textContent = maxSpeed;
    requestAnimationFrame(tick);
}

function drawTacho(rpm) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const w = canvas.width, h = canvas.height, segments = 75, active = Math.floor((rpm / 14000) * segments);
    const sX = 20, hY = 80, bY = h - 20, rad = bY - hY, curveEnd = 30;
    for (let i = 0; i <= segments; i++) {
        let x, y, ang, prog;
        if (i <= curveEnd) { prog = i / curveEnd; ang = Math.PI + (prog * (Math.PI / 2)); x = sX + rad + Math.cos(ang) * rad; y = hY + rad + Math.sin(ang) * rad; }
        else { prog = (i - curveEnd) / (segments - curveEnd); x = (sX + rad) + (prog * (w - 15 - (sX + rad))); y = hY; ang = 1.5 * Math.PI; }
        if (i < segments) {
            ctx.fillStyle = i < active ? (((i/segments)*14000) >= 12500 ? "#E4002B" : (((i/segments)*14000) >= 8000 ? "#004098" : "#FFFFFF")) : "#222";
            ctx.save(); ctx.translate(x, y); ctx.rotate(ang + Math.PI / 2); ctx.fillRect(-4, -20, 8, 40); ctx.restore();
        }
    }
    document.getElementById('rpm_val').textContent = Math.floor(rpm);
}

function timeFormat(ms) {
    let m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000), mss = Math.floor(ms%1000);
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${mss.toString().padStart(3,'0')}`;
}

document.getElementById('btConnect').onclick = ble;
document.getElementById('startBtn').onclick = () => {
    if(swState !== 1) { swState = 1; startTime = Date.now(); lastLapTime = startTime; lapStartTime = startTime; logData = []; maxSpeed = 0; lastPos = null; detectedDirection = null; document.getElementById('saveLogBtn').style.display = 'none'; }
    else { swState = 2; document.getElementById('saveLogBtn').style.display = 'flex'; }
};
document.getElementById('lapBtn').onclick = () => {
    if(swState === 1) processLap(Date.now(), false);
    else if(confirm("RESET ALL?")) location.reload();
};

window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight - 60; };
window.onload = () => { window.dispatchEvent(new Event('resize')); updateSettings(); tick(); };
</script>
</body>
</html>
