<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KLAP DEGI ULTIMATE V3.7 - HYBRID GPS</title>
    <style>
        :root { 
            --hrc-red: #E4002B; --hrc-blue: #004098; --bg-dark: #000; --hrc-white: #fff; --hrc-orange: #FFA500;
        }
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-dark); 
            color: var(--hrc-white); font-family: 'Arial Black', sans-serif; overflow: hidden; position: fixed;
        }
        #dashboard { position: relative; display: flex; flex-direction: column; height: 100dvh; width: 100vw; padding-top: env(safe-area-inset-top); }
        #canvas { position: absolute; top: 0; left: 0; width: 100%; height: calc(100% - 60px); z-index: 1; }

        /* UI Containers */
        .main-ui-container { position: absolute; right: 15px; top: 65px; bottom: 70px; display: flex; align-items: flex-start; gap: 25px; z-index: 20; }
        #info-overlay { display: flex; flex-direction: column; align-items: flex-end; text-align: right; gap: 5px; margin-top: 80px; pointer-events: none; }
        #rpm_val { font-size: 13vh; font-weight: 900; line-height: 0.8; text-shadow: 3px 3px 12px #000; }
        #display1 { font-size: 18vh; font-weight: 900; line-height: 0.9; text-shadow: 4px 4px 15px #000; }
        #sector-container { display: flex; justify-content: flex-end; gap: 15px; font-size: 4.5vh; font-weight: 900; height: 5vh; margin-bottom: 5px; }
        .sec-box { display: none; text-shadow: 2px 2px 10px #000; }
        #display { font-size: 2.8vh; opacity: 0.8; }

        .right-panels { display: flex; gap: 15px; height: 100%; }
        #lap-panel { width: 150px; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
        #lap { flex: 1; overflow-y: auto; scrollbar-width: none; }
        .lap-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 16px; font-weight: 900; }
        .best-lap { color: var(--hrc-red); }

        .data-panel { display: flex; flex-direction: column; gap: 15px; width: 100px; align-items: flex-end; }
        .label { font-size: 10px; color: var(--hrc-red); font-weight: bold; }
  .val { 
    font-size: 38px; 
    font-weight: 900; 
    line-height: 0.8; 
    text-shadow: 2px 2px 8px #000;
    text-align: right;    /* テキストを右寄せ */
    width: 100%;          /* 親要素の幅いっぱいに広げて端に寄せる */
    display: block;       /* 幅の指定を有効にする */
}

        footer { height: 55px; display: flex; gap: 2px; padding: 4px; background: #000; border-top: 1px solid #333; position: fixed; bottom: 0; left: 0; right: 0; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        button { flex: 1; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 9px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button.active { background: var(--hrc-red); }

        /* History */
        #history-page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 2000; padding: 20px; overflow-y: auto; box-sizing: border-box; }
        #history-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 20px; }
        #history-table th { color: var(--hrc-red); border-bottom: 2px solid var(--hrc-red); padding: 8px; }
        #history-table td { padding: 8px; border-bottom: 1px solid #333; text-align: center; }
        .close-btn { background: var(--hrc-red); color: #fff; padding: 15px; text-align: center; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
<div id="debug-info" style="position: fixed; top: env(safe-area-inset-top); left: 10px; z-index: 3000; font-family: monospace; font-size: 12px; color: #0f0; background: rgba(0,0,0,0.5); pointer-events: none; line-height: 1.2; padding: 5px;">
    DEBUG: GPS WAIT...
</div>
<div id="dashboard">
    <canvas id="canvas"></canvas>
    <div class="main-ui-container">
        <div id="info-overlay">
            <div id="rpm_val">0</div>
            <div id="display1">00:00.000</div>
            <div id="sector-container">
                <div id="s1_box" class="sec-box">S1: <span id="s1_val">--.---</span></div>
                <div id="s2_box" class="sec-box">S2: <span id="s2_val">--.---</span></div>
                <div id="s3_box" class="sec-box">S3: <span id="s3_val">--.---</span></div>
            </div>
            <div id="display">TOTAL 00:00.000</div>
        </div>
        <div class="right-panels">
            <div id="lap-panel"><div id="lap"></div></div>
            <div class="data-panel">
                <div class="data-box"><div class="label">SPEED</div><div class="val" id="speed_val">0</div></div>
                <div class="data-box"><div class="label">MAX</div><div class="val" id="max_speed_val" style="color: var(--hrc-orange);">0</div></div>
                <div class="data-box"><div class="label">TEMP</div><div class="val" id="temp_val">--</div></div>
            </div>
        </div>
    </div>
    <footer>
        <button id="intGpsBtn">INT GPS</button>
        <button id="btConnect">BLE START</button>
        <button id="startBtn">TIMER</button>
        <button id="lapBtn">LAP/RESET</button>
        <button id="historyBtn">HISTORY</button>
        <button id="gpxBtn" style="display:none; background:var(--hrc-orange); color:#000;">GPX SAVE</button>
    </footer>
</div>

<div id="history-page">
    <div class="close-btn" onclick="document.getElementById('history-page').style.display='none'">CLOSE HISTORY</div>
    <table id="history-table">
        <thead><tr><th>LAP</th><th>S1</th><th>S2</th><th>S3</th><th>S4</th><th>TIME</th><th>MAX SPD</th><th>MAX RPM</th></tr></thead>
        <tbody id="history-body"></tbody>
    </table>
</div>

<script>
'use strict';
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b", PULSE_UUID = "f4deb353-a4cf-4ffb-badb-2a5f2e3bb630";
let swState = 0, startTime = 0, lapStartTime = 0, lapRecords = [], gpsPoints = [];
let currentRPM = 0, currentTemp = 0, currentSpeedKmh = 0, maxSpeedInLap = 0, maxRpmInLap = 0;
let lastPos = null, lines = { startLine: null, s1Line: null, s2Line: null, s3Line: null };
let isFrozen = false, freezeDisplayTime = "", freezeUntil = 0;
let pulsePerRev = 1, cooldownMs = 15000, validDirection = null;
let s1_abs = 0, s2_abs = 0, s3_abs = 0, lastPassedSectorTime = 0;
let sectorDirections = { s1: null, s2: null, s3: null };
let watchId = null, wakeLock = null, intGpsTimer = null, bleGpsTimer = null;

const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

// --- インジケーター制御 ---
function updateIndicator(btnId, active) {
    const btn = document.getElementById(btnId);
    if (active) {
        btn.style.background = "#004098"; // 受信中：青
    } else {
        btn.style.background = btn.classList.contains('active') ? "var(--hrc-red)" : "#1a1a1a";
    }
}

// --- 判定ロジック ---
function getIntersection(p1, p2, line) {
    if (!line) return null;
    const x1 = p1.lon, y1 = p1.lat, x2 = p2.lon, y2 = p2.lat;
    const x3 = line.p1.lon, y3 = line.p1.lat, x4 = line.p2.lon, y4 = line.p2.lat;
    const den = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
    if (Math.abs(den) < 1e-12) return null;
    const t = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / den;
    const u = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / den;
    if (t >= 0 && t <= 1 && u >= -0.2 && u <= 1.2) {
        const Lx = x4 - x3, Ly = y4 - y3, Vx = x2 - x1, Vy = y2 - y1;
        return { time: p1.time + (p2.time - p1.time) * t, dir: (Lx * Vy - Ly * Vx) > 0 ? 1 : -1 };
    }
    return null;
}

// --- 内蔵GPS ---
async function toggleIntGps() {
    const btn = document.getElementById('intGpsBtn');
    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null; btn.classList.remove('active');
        updateIndicator('intGpsBtn', false);
        return;
    }
    btn.classList.add('active');
    if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    watchId = navigator.geolocation.watchPosition(pos => {
        // 青点灯処理
        updateIndicator('intGpsBtn', true);
        clearTimeout(intGpsTimer);
        intGpsTimer = setTimeout(() => updateIndicator('intGpsBtn', false), 1500);

        currentSpeedKmh = pos.coords.speed ? pos.coords.speed * 3.6 : 0;
        processPosition(pos.coords.latitude, pos.coords.longitude, Date.now());
    }, e => console.error(e), { enableHighAccuracy: true });
}

// --- BLE ---
async function connectBle() {
    const btn = document.getElementById('btConnect');
    try {
        const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const char = await service.getCharacteristic(PULSE_UUID);
        btn.classList.add('active');

        char.oncharacteristicvaluechanged = (e) => {
            const d = e.target.value;
            
            // --- デバッグ用：データが届いているか確認 ---
            const debugEl = document.getElementById('debug-info');
            if (debugEl) {
                // 届いたバイト数を表示（13のはず）
                debugEl.innerHTML = `RECEIVING: ${d.byteLength} bytes...`;
            }

            if (d.byteLength >= 13) {
                // ESP32のパケット構造に合わせて抽出
                const latRaw = d.getInt32(0, true);
                const lonRaw = d.getInt32(4, true);
                const lat = latRaw / 1000000;
                const lon = lonRaw / 1000000;

                // 共通変数に格納
                currentSpeedKmh = d.getUint16(8, true);
                currentTemp = d.getUint8(10);
                currentRPM = (d.getUint16(11, true) * 60) / pulsePerRev;

                // UI更新
                document.getElementById('temp_val').textContent = currentTemp;

                // 座標が 0 であってもデバッグ版 processPosition を呼び出す
                processPosition(lat, lon, Date.now());

                // 青点灯処理（座標が0以外の時のみ）
                if (latRaw !== 0 && lonRaw !== 0) {
                    updateIndicator('btConnect', true);
                    clearTimeout(bleGpsTimer);
                    bleGpsTimer = setTimeout(() => updateIndicator('btConnect', false), 1500);
                }
            }
        };
        await char.startNotifications();
    } catch (e) { 
        console.error(e);
        btn.classList.remove('active'); 
    }
}
function processPosition(lat, lon, time) {
    const debugEl = document.getElementById('debug-info');
    
    // --- 1. 超詳細デバッグ表示 (受信した生の値をそのまま出す) ---
    if (debugEl) {
        let statusColor = (lat === 0 && lon === 0) ? "orange" : "#0ff";
        let statusText = (lat === 0 && lon === 0) ? "GPS SEARCHING (WAITing 0.00)" : "GPS FIXED (READY)";
        
        debugEl.innerHTML = `
            <div style="color: #0f0; border-bottom: 1px solid #444; margin-bottom: 5px;">[BLE/GPS MONITOR]</div>
            <span style="color:${statusColor}; font-weight:bold;">${statusText}</span><br>
            LAT: <span style="color:#fff">${lat.toFixed(6)}</span><br>
            LON: <span style="color:#fff">${lon.toFixed(6)}</span><br>
            SPD: ${currentSpeedKmh} km/h | TEMP: ${currentTemp}℃<br>
            RPM: ${Math.round(currentRPM)} | PTS: ${gpsPoints.length}<br>
            <div style="font-size:10px; color:#888; margin-top:5px;">
                TIME: ${new Date(time).toLocaleTimeString()}.${time % 1000}<br>
                SW_STATE: ${swState} (1=REC)
            </div>
        `;
    }

    // --- 2. 保存・ラップ判定のガード条件 ---
    // 「計測中でない」 または 「座標が0（未測位）」 の場合は、ここから先（保存処理）へ進ませない
    if (swState !== 1) return;
    if (lat === 0 && lon === 0) return; 

    // --- 3. 走行データの記録 (ここから先は有効なデータのみ) ---
    if (currentSpeedKmh > maxSpeedInLap) maxSpeedInLap = Math.round(currentSpeedKmh);
    const cur = { lat, lon, time, rpm: currentRPM, speed: currentSpeedKmh };
    gpsPoints.push(cur);

    // --- 4. ラップ・セクター判定ロジック ---
    if (lastPos && lines.startLine) {
        const hitSL = getIntersection(lastPos, cur, lines.startLine);
        if (hitSL) {
            if (validDirection === null) validDirection = hitSL.dir;
            if (hitSL.dir === validDirection && (hitSL.time - (lapStartTime || startTime) > cooldownMs)) {
                processLap(hitSL.time, true);
            }
        }

        // セクター判定
        ['s1', 's2', 's3'].forEach(s => {
            const hit = getIntersection(lastPos, cur, lines[s + 'Line']);
            if (hit && (sectorDirections[s] === null || hit.dir === sectorDirections[s])) {
                if (sectorDirections[s] === null) sectorDirections[s] = hit.dir;
                const absTime = (hit.time - lapStartTime) / 1000;
                
                if (s === 's1' && s1_abs === 0) {
                    s1_abs = absTime; lastPassedSectorTime = absTime;
                    document.getElementById('s1_val').textContent = s1_abs.toFixed(3);
                } else if (s === 's2' && s2_abs === 0) {
                    s2_abs = absTime; lastPassedSectorTime = absTime;
                    document.getElementById('s2_val').textContent = (s1_abs > 0 ? s2_abs - s1_abs : s2_abs).toFixed(3);
                } else if (s === 's3' && s3_abs === 0) {
                    s3_abs = absTime; lastPassedSectorTime = absTime;
                    document.getElementById('s3_val').textContent = (s2_abs > 0 ? s3_abs - s2_abs : s3_abs).toFixed(3);
                }
            }
        });
    }

    // 次回判定用に保存
    lastPos = cur;
}
function processLap(hitTime, useFreeze) {
    const lapTimeMs = hitTime - (lapStartTime || startTime);
    const lapTimeSec = lapTimeMs / 1000;
    const lapData = { 
        no: lapRecords.length + 1, time: lapTimeMs, max: Math.round(maxSpeedInLap), maxRpm: Math.round(maxRpmInLap),
        s1: document.getElementById('s1_val').textContent, s2: document.getElementById('s2_val').textContent, 
        s3: document.getElementById('s3_val').textContent, s4: lastPassedSectorTime > 0 ? (lapTimeSec - lastPassedSectorTime).toFixed(3) : "--.---"
    };
    lapRecords.unshift(lapData);
    const best = Math.min(...lapRecords.map(r => r.time));
    document.getElementById('lap').innerHTML = lapRecords.map(r => `<div class="lap-row ${r.time === best && lapRecords.length > 1 ? 'best-lap' : ''}"><span>L${r.no}</span><span>${timeFormat(r.time)}</span></div>`).join('');
    if (useFreeze) { isFrozen = true; freezeDisplayTime = timeFormat(lapTimeMs); freezeUntil = Date.now() + 15000; }
    lapStartTime = hitTime; maxSpeedInLap = 0; maxRpmInLap = 0; s1_abs = 0; s2_abs = 0; s3_abs = 0; lastPassedSectorTime = 0;
    setTimeout(() => { if(swState === 1) ['s1_val','s2_val','s3_val'].forEach(id => document.getElementById(id).textContent = "--.---"); }, 3000);
}

// --- UI / Main Loop ---
function drawTacho(rpm) {
    const w = canvas.width = canvas.clientWidth, h = canvas.height = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const segments = 75, active = Math.floor((rpm / 14000) * segments);
    const sX = 25, hY = 40, bY = h - 10, rad = bY - hY, curveEnd = 30;
    for (let i = 0; i <= segments; i++) {
        let x, y, ang, prog;
        if (i <= curveEnd) { prog = i / curveEnd; ang = Math.PI + (prog * Math.PI / 2); x = sX + rad + Math.cos(ang) * rad; y = bY + Math.sin(ang) * rad; }
        else { prog = (i - curveEnd) / (segments - curveEnd); x = (sX + rad) + (prog * (w - (sX + rad) - 40)); y = hY; ang = 1.5 * Math.PI; }
        if (i % 10 === 0 || i === segments) {
            ctx.fillStyle = i <= active ? "#fff" : "#444"; ctx.font = `italic bold ${Math.max(12, h * 0.05)}px Arial`; ctx.textAlign = "center";
            ctx.fillText(Math.round((i / segments) * 14), x + Math.cos(ang) * 38, y + Math.sin(ang) * 38);
        }
        if (i < segments) {
            ctx.fillStyle = (i < active) ? (((i/segments)*14000 >= 12500) ? "var(--hrc-red)" : ((i/segments)*14000 >= 8000) ? "var(--hrc-blue)" : "#fff") : "#222";
            ctx.save(); ctx.translate(x, y); ctx.rotate(ang + Math.PI / 2); ctx.fillRect(-Math.max(4, w*0.012)/2, -Math.max(25, h*0.12)/2, Math.max(4, w*0.012), Math.max(25, h*0.12)); ctx.restore();
        }
    }
    document.getElementById('rpm_val').textContent = Math.floor(rpm);
    document.getElementById('speed_val').textContent = Math.round(currentSpeedKmh);
}

function mainLoop() {
    const now = Date.now();
    if (swState === 1) {
        if (currentRPM > maxRpmInLap) maxRpmInLap = Math.round(currentRPM);
        document.getElementById('display').textContent = "TOTAL " + timeFormat(now - startTime);
        document.getElementById('display1').textContent = (isFrozen && now < freezeUntil) ? freezeDisplayTime : timeFormat(now - (lapStartTime || startTime));
    }
    drawTacho(currentRPM);
    requestAnimationFrame(mainLoop);
}

// --- Events ---
document.getElementById('intGpsBtn').onclick = toggleIntGps;
document.getElementById('btConnect').onclick = connectBle;
document.getElementById('startBtn').onclick = function() {
    if (swState !== 1) { swState = 1; startTime = Date.now(); lapStartTime = 0; lapRecords = []; gpsPoints = []; this.classList.add('active'); document.getElementById('gpxBtn').style.display='none'; }
    else { swState = 2; this.classList.remove('active'); document.getElementById('gpxBtn').style.display='block'; }
};
document.getElementById('lapBtn').onclick = () => { if (swState === 1) processLap(Date.now(), false); else if (confirm("RESET?")) location.reload(); };
document.getElementById('historyBtn').onclick = () => {
    if (lapRecords.length === 0) return;
    const bT = Math.min(...lapRecords.map(r => r.time));
    document.getElementById('history-body').innerHTML = lapRecords.map(r => `<tr style="${r.time === bT ? 'background:rgba(228,0,43,0.15);' : ''}"><td>${r.no}</td><td>${r.s1}</td><td>${r.s2}</td><td>${r.s3}</td><td>${r.s4}</td><td style="${r.time===bT?'color:var(--hrc-red);':''}">${timeFormat(r.time)}</td><td>${r.max}</td><td>${r.maxRpm}</td></tr>`).join('');
    document.getElementById('history-page').style.display = 'block';
};
    document.getElementById('gpxBtn').onclick = () => {
    if (gpsPoints.length === 0) {
        alert("保存するGPSデータがありません。");
        return;
    }

    let gpx = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="KLAP_DEGI" xmlns="http://www.topografix.com/GPX/1/1">
<trk><name>Track Log</name><trkseg>`;

    gpsPoints.forEach(p => {
        gpx += `
<trkpt lat="${p.lat}" lon="${p.lon}">
    <time>${new Date(p.time).toISOString()}</time>
    <extensions>
        <speed>${(p.speed / 3.6).toFixed(2)}</speed>
        <hr>${Math.round(p.rpm)}</hr>
    </extensions>
</trkpt>`;
    });

    gpx += `\n</trkseg></trk></gpx>`;

    const blob = new Blob([gpx], { type: 'application/gpx+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `log_${new Date().toISOString().replace(/[:.]/g, '-')}.gpx`;
    a.click();
    URL.revokeObjectURL(url);
};
function timeFormat(ms){ if(ms<0) ms=0; const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), ms2=Math.floor(ms%1000); return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${ms2.toString().padStart(3,'0')}`; }
window.onload = () => {
    ['startLine', 's1Line', 's2Line', 's3Line'].forEach(key => {
        const lat = localStorage.getItem(key + 'P1Lat');
        if (lat) {
            lines[key] = { p1: { lat: parseFloat(localStorage.getItem(key + 'P1Lat')), lon: parseFloat(localStorage.getItem(key + 'P1Lon')) }, p2: { lat: parseFloat(localStorage.getItem(key + 'P2Lat')), lon: parseFloat(localStorage.getItem(key + 'P2Lon')) } };
            const boxId = key.replace('Line', '') + '_box';
            if (document.getElementById(boxId)) document.getElementById(boxId).style.display = 'block';
        }
    });
    pulsePerRev = parseFloat(localStorage.getItem('pl1')) || 1;
    cooldownMs = parseInt(localStorage.getItem('lapCoolDownTime')) || 15000;
    mainLoop();
};
</script>
</body>
</html>
