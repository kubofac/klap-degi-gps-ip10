<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS DIAG V3</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        .log-box { border: 1px solid #444; padding: 10px; height: 100px; overflow-y: scroll; background: #111; margin-bottom: 15px; font-size: 11px; color: #aaa; }
        .stat-item { margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .label { font-size: 12px; color: #0088ff; display: block; }
        .val { color: #fff; font-size: 28px; font-weight: bold; }
        button { width: 100%; height: 70px; background: #0088ff; color: white; border: none; font-size: 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <h3 style="color:#0088ff">KLAP GPS DIAGNOSIS</h3>
    <div class="log-box" id="log">READY...</div>

    <div class="stat-item">
        <span class="label">COORDINATES</span>
        <span id="pos" class="val">WAITING FIX...</span>
    </div>

    <div style="display: flex; justify-content: space-between;">
        <div class="stat-item" style="width: 45%;">
            <span class="label">SPEED</span>
            <span id="speed" class="val">0</span> km/h
        </div>
        <div class="stat-item" style="width: 45%;">
            <span class="label">RPM</span>
            <span id="rpm" class="val">0</span>
        </div>
    </div>

    <div class="stat-item">
        <span class="label">TEMP</span>
        <span id="temp" class="val">0</span> ℃
    </div>
    
    <div style="font-size: 11px; color: #444;">
        RECV: <span id="count">0</span> | BYTES: <span id="len">0</span>
    </div>

    <button id="btn">CONNECT UNIT</button>

<script>
// ★ここを末尾 "b" と "0" に修正しました
const S_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const C_UUID = "f4deb353-a4cf-4ffb-badb-2a5f2e3bb630";
let recvCount = 0;

function addLog(msg) {
    const log = document.getElementById('log');
    log.innerHTML += `> ${msg}<br>`;
    log.scrollTop = log.scrollHeight;
}

function handleData(event) {
    const d = event.target.value;
    recvCount++;
    document.getElementById('count').textContent = recvCount;
    document.getElementById('len').textContent = d.byteLength;

    if (d.byteLength >= 13) {
        // DataViewを使ってスマートに解析
        const lat = d.getInt32(0, true) / 1000000;
        const lng = d.getInt32(4, true) / 1000000;
        const speed = d.getUint16(8, true);
        const temp = d.getUint8(10);
        const hz = d.getUint16(11, true);

        if(lat !== 0) {
            document.getElementById('pos').textContent = lat.toFixed(6) + ", " + lng.toFixed(6);
        }
        document.getElementById('speed').textContent = speed;
        document.getElementById('temp').textContent = temp;
        document.getElementById('rpm').textContent = hz * 60;
    }
}

document.getElementById('btn').onclick = async () => {
    try {
        addLog("Scanning...");
        const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [S_UUID] }] });
        addLog("Connecting...");
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(S_UUID);
        const char = await service.getCharacteristic(C_UUID);

        char.addEventListener('characteristicvaluechanged', handleData);
        await char.startNotifications();
        addLog("SUCCESS: Connected!");
    } catch (e) {
        addLog("ERR: " + e.message);
    }
};
</script>
</body>
</html>
