<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KLAP LOG v3.8</title>
    <style>
        body { background: #000; color: #0f0; font-family: 'Courier New', monospace; padding: 15px; margin: 0; overflow: hidden; }
        .header { border-bottom: 2px solid #0088ff; padding-bottom: 8px; margin-bottom: 15px; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .stat-box { background: #111; border: 1px solid #333; padding: 10px; border-radius: 5px; text-align: center; }
        .data-card { background: #1a1a1a; border-left: 5px solid #0088ff; padding: 12px; border-radius: 4px; margin-bottom: 10px; }
        .label { color: #888; font-size: 11px; display: block; }
        .val { font-size: 26px; font-weight: bold; color: #fff; line-height: 1.2; }
        .unit { font-size: 14px; color: #666; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        button { height: 65px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; -webkit-appearance: none; }
        #btnConnect { background: #0044aa; grid-column: span 2; }
        #btnRecord { background: #444; }
        #btnRecord.recording { background: #cc0000; border: 2px solid #fff; }
        #btnSave { background: #28a745; }

        #log { font-size: 11px; color: #aaa; height: 100px; overflow-y: scroll; background: #050505; padding: 8px; border: 1px solid #333; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header"><h2 style="margin:0; color:#0088ff; font-size: 18px;">KLAP LOGGING v3.8</h2></div>

    <div class="btn-group">
        <button id="btnConnect">1. BLE CONNECT</button>
        <button id="btnRecord">2. REC START</button>
        <button id="btnSave">3. DOWNLOAD GPX</button>
    </div>

    <div class="stat-grid">
        <div class="stat-box"><div class="label">RATE</div><div id="rate" class="val">0.0<span class="unit">Hz</span></div></div>
        <div class="stat-box"><div class="label">LOGGED</div><div id="log_count" class="val" style="color:#f0f;">0</div></div>
    </div>

    <div class="data-card">
        <span class="label">GPS POSITION</span>
        <div id="pos" class="val" style="font-size: 18px;">WAITING...</div>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
        <div class="data-card"><span class="label">SPD</span><span id="speed" class="val">0</span></div>
        <div class="data-card"><span class="label">RPM</span><span id="rpm" class="val">0</span></div>
        <div class="data-card"><span class="label">TEMP</span><span id="temp" class="val">0</span><span class="unit">℃</span></div>
    </div>

    <div id="log">Ready.</div>

<script>
const S_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
const C_UUID = "f4deb353-a4cf-4ffb-badb-2a5f2e3bb630";

let isRecording = false;
let logData = [];
let frames = 0;
let lastTime = Date.now();

function addLog(m) {
    const l = document.getElementById('log');
    l.innerHTML = "> " + m + "<br>" + l.innerHTML;
}

setInterval(() => {
    const now = Date.now();
    const delta = (now - lastTime) / 1000;
    if (delta > 0) document.getElementById('rate').textContent = (frames / delta).toFixed(1);
    frames = 0; lastTime = now;
}, 1000);

document.getElementById('btnConnect').onclick = async () => {
    try {
        const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [S_UUID] }] });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(S_UUID);
        const char = await service.getCharacteristic(C_UUID);

        char.addEventListener('characteristicvaluechanged', (e) => {
            const d = e.target.value;
            frames++;
            if (d.byteLength >= 13) {
                const latInt = d.getInt32(0, true);
                const lngInt = d.getInt32(4, true);
                const speed = d.getUint16(8, true);
                const temp = d.getUint8(10);
                const hz = d.getUint16(11, true);
                const rpm = hz * 60;

                const lat = latInt / 1000000;
                const lng = lngInt / 1000000;
                
                // 表示更新（水温 temp を含む）
                document.getElementById('pos').textContent = (latInt === 0) ? "NO GPS FIX" : lat.toFixed(6) + "," + lng.toFixed(6);
                document.getElementById('speed').textContent = speed;
                document.getElementById('rpm').textContent = rpm;
                document.getElementById('temp').textContent = temp;

                // 記録（水温は含めない）
                if (isRecording) {
                    logData.push({
                        t: new Date().toISOString(),
                        la: lat, lo: lng,
                        sp: (speed / 3.6).toFixed(2),
                        r: rpm
                    });
                    document.getElementById('log_count').textContent = logData.length;
                }
            }
        });
        await char.startNotifications();
        addLog("BLE Connected");
        document.getElementById('btnConnect').innerText = "CONNECTED";
    } catch (e) { addLog("Err: " + e.message); }
};

document.getElementById('btnRecord').onclick = function() {
    isRecording = !isRecording;
    if (isRecording) {
        logData = []; 
        document.getElementById('log_count').textContent = "0";
        this.textContent = "STOP REC";
        this.classList.add('recording');
        addLog("Recording...");
    } else {
        this.textContent = "REC START";
        this.classList.remove('recording');
        addLog("Paused. Total: " + logData.length);
    }
};

document.getElementById('btnSave').onclick = () => {
    if (logData.length < 5) {
        addLog("Too few points to save.");
        return;
    }
    
    addLog("Generating File...");
    
    let gpx = '<?xml version="1.0" encoding="UTF-8"?>\n' +
              '<gpx version="1.1" creator="KLAP" xmlns="http://www.topografix.com/GPX/1/1" xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1">\n' +
              '<trk><name>LOG</name><trkseg>\n';
    
    for (let p of logData) {
        gpx += `<trkpt lat="${p.la}" lon="${p.lo}"><time>${p.t}</time><speed>${p.sp}</speed><extensions><gpxtpx:TrackPointExtension><gpxtpx:hr>${p.r}</gpxtpx:hr></gpxtpx:TrackPointExtension></extensions></trkpt>\n`;
    }

    gpx += '</trkseg></trk></gpx>';
    
    try {
        const blob = new Blob([gpx], { type: 'application/gpx+xml' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `KLAP_${Math.floor(Date.now()/1000)}.gpx`;
        
        // iOS対策：bodyに追加して即クリック
        document.body.appendChild(a);
        a.click();
        
        // クリーンアップ
        setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
            addLog("Download Triggered");
        }, 100);
    } catch (err) {
        addLog("Save Error: " + err.message);
    }
};
</script>
</body>
</html>
