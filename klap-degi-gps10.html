<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE FINAL CHECK</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 20px; }
        .log-box { border: 1px solid #444; padding: 10px; height: 120px; overflow-y: scroll; background: #111; margin-bottom: 20px; font-size: 12px; }
        .stat-item { margin-bottom: 10px; border-bottom: 1px solid #222; }
        .val { color: #fff; font-size: 28px; font-weight: bold; }
        button { width: 100%; height: 70px; background: #0088ff; color: white; border: none; font-size: 20px; border-radius: 12px; }
    </style>
</head>
<body>

    <h3>BLE DIAGNOSIS (iOS FIX)</h3>
    <div class="log-box" id="log">--- READY ---<br></div>

    <div class="stat-item">RECV COUNT: <span id="count" class="val">0</span></div>
    <div class="stat-item">LAST DATA: <span id="rawdata" class="val" style="color:#ff0">WAITING...</span></div>
    <div class="stat-item">Hz: <span id="hz" class="val">0</span> / TEMP: <span id="temp" class="val">0</span></div>

    <button id="btn">CONNECT DEVICE</button>

<script>
const S_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914f";
const C_UUID = "f4deb353-a4cf-4ffb-badb-2a5f2e3bb63f";
let recvCount = 0;

function addLog(msg) {
    const log = document.getElementById('log');
    log.innerHTML += `> ${msg}<br>`;
    log.scrollTop = log.scrollHeight;
}

// iPhoneでイベントを拾うための「最強の関数」
function handleData(event) {
    recvCount++;
    document.getElementById('count').textContent = recvCount;
    
    // iOS/Bluefyで最も安全なデータの取り出し方
    const buffer = event.target.value.buffer;
    const bytes = new Uint8Array(buffer);
    
    // 強制的に画面更新
    const rawStr = "[" + bytes.join(", ") + "]";
    document.getElementById('rawdata').textContent = rawStr;

    if (bytes.length >= 3) {
        document.getElementById('hz').textContent = bytes[0] | (bytes[1] << 8);
        document.getElementById('temp').textContent = bytes[2];
    }
}

document.getElementById('btn').onclick = async () => {
    try {
        addLog("Requesting...");
        const device = await navigator.bluetooth.requestDevice({
            filters: [{ services: [S_UUID] }]
        });

        addLog("Connecting...");
        const server = await device.gatt.connect();
        
        addLog("Stabilizing (2s)...");
        await new Promise(r => setTimeout(r, 2000));

        addLog("Getting Service...");
        const service = await server.getPrimaryService(S_UUID);
        
        addLog("Getting Characteristic...");
        const char = await service.getCharacteristic(C_UUID);

        // --- iOS/Bluefy対策：addEventListener を使い、かつ start よりも先に登録 ---
        addLog("Setting up Listener...");
        char.addEventListener('characteristicvaluechanged', handleData);

        addLog("Starting Notifications...");
        await char.startNotifications();
        
        addLog("SUCCESS: Monitoring active.");

    } catch (e) {
        addLog("ERROR: " + e.message);
        alert(e.message);
    }
};
</script>
</body>
</html>
