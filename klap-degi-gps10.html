<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>KLAP DEGI ULTIMATE V3.5</title>
<style>
    :root { 
        --hrc-red: #E4002B; 
        --hrc-blue: #004098; 
        --hrc-white: #ffffff; 
        --bg-dark: #000000; 
        --hrc-orange: #FFA500; 
    }

    body, html { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        background-color: var(--bg-dark); 
        color: var(--hrc-white); 
        font-family: 'Arial Black', sans-serif; 
        overflow: hidden; 
        position: fixed; 
    }

    #dashboard { 
        position: relative; 
        display: flex; 
        flex-direction: column; 
        height: 100dvh; 
        width: 100vw; 
        padding-top: env(safe-area-inset-top); 
    }

    #canvas { 
        position: absolute; 
        top: 0; 
        left: 0; 
        width: 100% !important; 
        height: calc(100% - 60px) !important; 
        z-index: 1; 
    }

    .main-ui-container {
        position: absolute; 
        right: 5px; 
        top: 130px; 
        bottom: 60px; 
        display: flex; 
        flex-direction: row; 
        align-items: flex-start; 
        gap: 15px; 
        z-index: 20; 
        pointer-events: none;
    }

    #info-overlay { 
        display: flex; 
        flex-direction: column; 
        align-items: flex-end; 
        text-align: right; 
        height: 100%; 
        justify-content: center; 
    }

    #rpm_val { 
        font-size: 11vh; 
        font-weight: 900; 
        line-height: 0.8; 
        text-shadow: 3px 3px 10px #000; 
        margin-bottom: 10px; 
    }

    #display1 { 
        font-size: 17vh; 
        letter-spacing: -2px; 
        transform: scaleX(0.9); 
        transform-origin: right; 
        font-weight: 900; 
        line-height: 0.8; 
        color: var(--hrc-white); 
        text-shadow: 4px 4px 15px #000; 
        white-space: nowrap; 
    }

    #display { 
        font-size: 3.5vh; 
        color: #bbb; 
        text-shadow: 1px 1px 6px #000; 
        margin-top: 5px; 
    }

    #lap-panel { 
        width: 130px; 
        height: calc(100% - 20px); 
        display: flex; 
        flex-direction: column; 
        overflow: hidden; 
        padding-top: 10px; 
    }

    #lap { 
        flex: 1; 
        overflow-y: auto; 
        -webkit-overflow-scrolling: touch; 
        scrollbar-width: none; 
    }

    #lap::-webkit-scrollbar { display: none; }

    .lap-row { 
        display: flex; 
        justify-content: flex-end; 
        gap: 10px; 
        padding: 5px 0; 
        border-bottom: 1px solid rgba(255,255,255,0.1); 
        font-size: 15px; 
        font-weight: 900; 
    }

    .best-lap { color: var(--hrc-red); }

    .data-panel { 
        display: flex; 
        flex-direction: column; 
        gap: 10px; 
        width: 85px; 
        padding-top: 10px; 
    }

    .data-box { 
        display: flex; 
        flex-direction: column; 
        align-items: flex-end; 
    }

    .label { 
        font-size: 10px; 
        color: var(--hrc-red); 
        font-weight: bold; 
    }

    .val { 
        font-size: 30px; 
        font-weight: 900; 
        line-height: 0.9; 
    }

    footer { 
        height: 45px; 
        display: flex; 
        gap: 4px; 
        padding: 3px; 
        background: #000; 
        border-top: 1px solid #333; 
        z-index: 10000; 
        position: fixed; 
        bottom: 0; 
        left: 0; 
        right: 0; 
        padding-bottom: env(safe-area-inset-bottom); 
        pointer-events: auto;
    }

    button { 
        flex: 1; 
        background: #1a1a1a; 
        color: #fff; 
        border: 1px solid #444; 
        border-radius: 6px; 
        font-size: 10px; 
        font-weight: bold; 
        cursor: pointer; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        height: 100%; 
    }

    #saveLogBtn { background: #155724; display: none; }

    .demo-active { animation: demoBlink 1s infinite; }

    @keyframes demoBlink { 
        0% {background-color: var(--hrc-orange); color: #000;} 
        50% {background-color: #885500; color: #000;} 
        100% {background-color: var(--hrc-orange); color: #000;} 
    }
</style>
</head>
<body>

<div id="dashboard">
    <canvas id="canvas"></canvas>
    <div class="main-ui-container">
        <div id="info-overlay">
            <div id="rpm_val">0</div>
            <div id="display1">00:00.000</div>
            <div id="display">TOTAL 00:00.000</div>
        </div>
        <div id="lap-panel"><div id="lap"></div></div>
        <div class="data-panel">
            <div class="data-box"><div class="label">SPEED</div><div class="val" id="speed_val">0</div></div>
            <div class="data-box"><div class="label">MAX</div><div class="val" id="max_speed_val" style="color:var(--hrc-orange);">0</div></div>
            <div class="data-box"><div class="label">TEMP</div><div class="val" id="temp_val">--</div></div>
        </div>
    </div>
    <footer>
        <button id="btConnect">BLE START</button>
        <button id="startBtn">TIMER</button>
        <button id="lapBtn">LAP/RESET</button>
        <button id="saveLogBtn">LOG SAVE</button>
        <button id="reloadBtn">RELOAD</button>
    </footer>
</div>

<script>
'use strict';
const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b", PULSE_UUID = "f4deb353-a4cf-4ffb-badb-2a5f2e3bb630";
let currentRPM = 0, currentTemp = 0, currentSpeedKmh = 0, maxSpeed = 0;
let lat = 0, lon = 0, lastLapTime = 0;
let swState = 0, startTime = 0, lapStartTime = 0, lapRecords = [];
let logData = [], lastBleDataTime = 0;
let isFrozen = false, freezeDisplayTime = "", freezeStartTime = 0;
let isDemoMode = false, demoClickCount = 0, demoInterval = null, wakeLock = null;
const canvas = document.getElementById('canvas'), ctx = canvas.getContext('2d');

async function ble() {
    try {
        if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
        const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE_UUID] }] });
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        const char = await service.getCharacteristic(PULSE_UUID);
        
        char.addEventListener('characteristicvaluechanged', (e) => {
            const d = e.target.value;
            lastBleDataTime = Date.now();
            if (d.byteLength >= 13) {
                const latInt = d.getInt32(0, true);
                const lonInt = d.getInt32(4, true);
                lat = latInt / 1000000;
                lon = lonInt / 1000000;
                currentSpeedKmh = d.getUint16(8, true);
                currentTemp = d.getUint8(10);
                let rawHz = d.getUint16(11, true); 
                let pCount = parseInt(localStorage.getItem('pl1')) || 1;
                currentRPM = (rawHz * 60) / pCount;

                document.getElementById('speed_val').textContent = currentSpeedKmh;
                document.getElementById('temp_val').textContent = currentTemp;

                if (swState === 1) {
                    if (currentSpeedKmh > maxSpeed) maxSpeed = currentSpeedKmh;
                    logData.push({
                        t: new Date().toISOString(), la: lat, lo: lon,
                        sp: (currentSpeedKmh / 3.6).toFixed(2), r: Math.round(currentRPM)
                    });
                }
            }
        });
        await char.startNotifications();
    } catch (e) { alert("BLE Error: " + e.message); }
}

function processLap(now, isAuto) {
    const lapTime = now - lastLapTime;
    lastLapTime = now;
    lapRecords.unshift(lapTime);

    if (logData && logData.length > 0) {
        logData[logData.length - 1].isLap = true;
    }

    // --- 表示の固定処理 ---
    isFrozen = true; 
    freezeDisplayTime = timeFormat(lapTime); // ラップタイムを固定文字として保存
    freezeStartTime = now; 

    const display1 = document.getElementById('display1');
    display1.innerText = freezeDisplayTime; 
    
    // ★色変更（#FFD700）の記述を削除し、白を維持
    display1.style.color = "var(--hrc-white)"; 
    
    setTimeout(() => {
        // 15秒経ったらフリーズを解除して計測中のタイムに戻す
        isFrozen = false; 
    }, 15000);
    // -------------------------

    const lapDiv = document.getElementById('lap');
    const bestTime = Math.min(...lapRecords);
    lapDiv.innerHTML = lapRecords.map((t, i) => {
        const lapNum = lapRecords.length - i;
        return `
            <div class="lap-row ${t === bestTime ? 'best-lap' : ''}">
                <span>L${lapNum}</span>
                <span>${timeFormat(t)}</span> 
            </div>
        `;
    }).join('');

    if (window.navigator.vibrate) window.navigator.vibrate([100, 50, 100]);
}

async function exportGPX() {
    if (logData.length < 5) { alert("ログ不足"); return; }
    let gpx = `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="KLAP" xmlns="http://www.topografix.com/GPX/1/1" xmlns:gpxtpx="http://www.garmin.com/xmlschemas/TrackPointExtension/v1">`;
    let lapCount = 1;
    gpx += `\n<trk><name>L${lapCount}</name><trkseg>`;
    logData.forEach((p, index) => {
        gpx += `\n<trkpt lat="${p.la.toFixed(7)}" lon="${p.lo.toFixed(7)}"><time>${p.t.substring(0,19)}Z</time><speed>${p.sp}</speed><extensions><gpxtpx:TrackPointExtension><gpxtpx:hr>${p.r}</gpxtpx:hr></gpxtpx:TrackPointExtension></extensions></trkpt>`;
        if (p.isLap && index < logData.length - 1) {
            lapCount++;
            gpx += `\n</trkseg></trk>\n<trk><name>L${lapCount}</name><trkseg>`;
        }
    });
    gpx += `\n</trkseg></trk>\n</gpx>`;
    try {
        const blob = new Blob([gpx], { type: 'application/octet-stream' });
        const file = new File([blob], `KLAP_${Date.now()}.gpx`, { type: 'application/octet-stream' });
        if (navigator.share) await navigator.share({ files: [file] });
        else {
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = file.name; a.click();
        }
    } catch (e) { console.error(e); }
}

function timeFormat(ms) {
    let m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000), mss = Math.floor(ms%1000);
    return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}.${mss.toString().padStart(3,'0')}`;
}

function tick() {
    if (swState !== 1) return;
    const now = Date.now();
    document.getElementById('display').textContent = "TOTAL " + timeFormat(now - startTime);
    
    const d1 = document.getElementById('display1');
    if (isFrozen) {
        d1.textContent = freezeDisplayTime;
        if (now - freezeStartTime > 15000) isFrozen = false;
    } else { 
        d1.textContent = timeFormat(now - lastLapTime); 
    }
    document.getElementById('max_speed_val').textContent = maxSpeed;
    requestAnimationFrame(tick);
}

function drawTacho(rpm) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const w = canvas.width, h = canvas.height, segments = 75, active = Math.floor((rpm / 14000) * segments);
    const sX = 20, hY = 80, bY = h - 20, rad = bY - hY, curveEnd = 30;
    for (let i = 0; i <= segments; i++) {
        let x, y, ang, prog;
        if (i <= curveEnd) { prog = i / curveEnd; ang = Math.PI + (prog * (Math.PI / 2)); x = sX + rad + Math.cos(ang) * rad; y = hY + rad + Math.sin(ang) * rad; }
        else { prog = (i - curveEnd) / (segments - curveEnd); x = (sX + rad) + (prog * (w - 15 - (sX + rad))); y = hY; ang = 1.5 * Math.PI; }
        if (i % 10 === 0 || i === segments) {
            ctx.save(); ctx.fillStyle = i < active ? "#fff" : "#444"; ctx.font = "italic bold 20px Arial"; ctx.textAlign = "center";
            ctx.fillText(Math.round((i / segments) * 14), x + Math.cos(ang) * 40, y + Math.sin(ang) * 40); ctx.restore();
        }
        if (i < segments) {
            ctx.fillStyle = i < active ? (((i/segments)*14000) >= 12500 ? "#E4002B" : (((i/segments)*14000) >= 8000 ? "#004098" : "#FFFFFF")) : "#222";
            ctx.save(); ctx.translate(x, y); ctx.rotate(ang + Math.PI / 2); ctx.fillRect(-4, -20, 8, 40); ctx.restore();
        }
    }
    document.getElementById('rpm_val').textContent = Math.floor(rpm);
}

function updateButtonColors() {
    const now = Date.now();
    const btBtn = document.getElementById('btConnect');
    const isConnected = (lastBleDataTime !== 0 && (now - lastBleDataTime < 2000));
    btBtn.style.backgroundColor = (isConnected && lat !== 0) ? "var(--hrc-red)" : (isConnected ? "var(--hrc-orange)" : "#1a1a1a");
    document.getElementById('startBtn').style.backgroundColor = (swState === 1) ? "var(--hrc-red)" : "#1a1a1a";
}
setInterval(updateButtonColors, 1000);

document.getElementById('btConnect').onclick = ble;
document.getElementById('saveLogBtn').onclick = exportGPX;
document.getElementById('startBtn').onclick = () => {
    if(swState !== 1) { 
        swState = 1; startTime = Date.now(); lastLapTime = startTime; lapStartTime = startTime;
        logData = []; maxSpeed = 0; document.getElementById('saveLogBtn').style.display = 'none'; tick(); 
    } else { 
        swState = 2; document.getElementById('saveLogBtn').style.display = 'flex';
    }
};
document.getElementById('lapBtn').onclick = () => {
    if(swState === 1) processLap(Date.now(), false);
    else { 
        swState = 0; lapRecords = []; logData = []; maxSpeed = 0; isFrozen = false;
        document.getElementById('lap').innerHTML = ""; 
        document.getElementById('display1').textContent = "00:00.000"; 
        document.getElementById('display1').style.color = "var(--hrc-white)";
        document.getElementById('display').textContent = "TOTAL 00:00.000"; 
        document.getElementById('max_speed_val').textContent = "0";
    }
};

document.getElementById('reloadBtn').onclick = () => {
    demoClickCount++; setTimeout(() => { demoClickCount = 0; }, 2000);
    if (demoClickCount >= 5) {
        isDemoMode = !isDemoMode;
        if (isDemoMode) {
            if (swState !== 1) document.getElementById('startBtn').click();
            demoInterval = setInterval(() => {
                currentRPM = Math.floor(Math.random() * 4000) + 8000;
                currentSpeedKmh = Math.floor(Math.random() * 50) + 110;
                document.getElementById('speed_val').textContent = currentSpeedKmh;
                if (currentSpeedKmh > maxSpeed) maxSpeed = currentSpeedKmh;
                if (Date.now() - lastLapTime > 25000) processLap(Date.now(), true);
            }, 100);
        } else { clearInterval(demoInterval); currentRPM = 0; }
    } else { location.reload(); }
};

window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight - 60; };
window.onload = () => { 
    window.dispatchEvent(new Event('resize')); 
    (function r(){ drawTacho(currentRPM); requestAnimationFrame(r); })(); 
};
</script>
</body>
</html>
