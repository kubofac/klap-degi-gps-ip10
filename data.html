<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>GPX Export (Safari)</title>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; padding: 20px; text-align: center; }
        textarea { width: 100%; height: 300px; background: #333; color: #0f0; margin-bottom: 20px; border-radius: 10px; border: 1px solid #555; padding: 10px; font-size: 12px; }
        .btn { width: 100%; padding: 20px; background: #ff9900; color: black; font-weight: bold; border: none; border-radius: 10px; font-size: 18px; }
    </style>
</head>
<body>
    <h2>GPX書き出し</h2>
    <p>Bluefyでコピーした内容を下に貼り付け</p>
    <textarea id="input" placeholder="ここにペースト"></textarea>
    <button class="btn" onclick="save()">GPXファイルとして保存</button>

    <script>
        function save() {
            const txt = document.getElementById('input').value;
            if(!txt.includes('<gpx')) { alert("データが正しくありません"); return; }
            const blob = new Blob([txt], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Log_${Date.now()}.gpx`;
            a.click();
            alert("Safariのダウンロードを確認してください");
        }
    </script>
</body>
</html>
