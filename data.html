<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GPX ANALYZER</title>
    <style>
        :root { --hrc-red: #E4002B; --bg-dark: #000; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Arial Black', sans-serif; background: var(--bg-dark); color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 100dvh; }
        h2 { color: var(--hrc-red); text-align: center; font-style: italic; margin-bottom: 5px; }
        .btn-main { 
            width: 100%; height: 80px; background: var(--hrc-red); color: white; border: none; 
            border-radius: 20px; font-size: 1.4rem; font-weight: 900; 
            box-shadow: 0 4px 20px rgba(228, 0, 43, 0.4); margin-bottom: 20px; 
        }
        textarea { 
            width: 100%; flex-grow: 1; background: #111; color: #0f0; 
            border: 1px solid #333; border-radius: 12px; padding: 15px; 
            font-family: monospace; font-size: 13px; outline: none;
        }
    </style>
</head>
<body>

    <h2>GPX ANALYZER</h2>
    <p style="text-align:center; font-size:11px; color:#888;">iPhone 8 / Bluefy 動作保証版</p>

    <button id="pasteBtn" class="btn-main">📋 IMPORT & SAVE</button>

    <textarea id="input" placeholder="ここにGPXを貼り付け..."></textarea>

    <script>
        document.getElementById('pasteBtn').addEventListener('click', async function() {
            const area = document.getElementById('input');
            const btn = this;

            try {
                // 【最重要】iOSでポップアップを出すための直接呼び出し
                // 実行すると「"Bluefy"に他のAppからコピーした内容を読み取らせますか？」が出ます
                const text = await navigator.clipboard.readText();
                
                if (text && text.includes('<gpx')) {
                    area.value = text;
                    executeSave(text);
                } else {
                    alert("クリップボードにGPXデータがありません。\nロガー側で再度コピーしてください。");
                }
            } catch (err) {
                // Clipboard APIが完全に拒否された場合の挙動
                console.error("Clipboard Error:", err);
                
                // すでに手動でペーストされている場合
                if (area.value.includes('<gpx')) {
                    executeSave(area.value);
                } else {
                    // iPhone 8 の古いiOSの場合の最終手段
                    area.focus();
                    alert("【ヒント】\n下の黒い枠を1回タップして『ペースト』を選び、その後にこのボタンをもう一度押してください。");
                }
            }
        });

        function executeSave(txt) {
            const blob = new Blob([txt.trim()], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const now = new Date();
            const timeStr = String(now.getHours()).padStart(2,'0') + String(now.getMinutes()).padStart(2,'0');

            a.href = url;
            a.download = `Log_${timeStr}.gpx`;
            document.body.appendChild(a);
            a.click();
            
            this.style.background = "#28a745";
            this.textContent = "✅ SAVED!";
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                this.style.background = "var(--hrc-red)";
                this.textContent = "📋 IMPORT & SAVE";
            }, 3000);
        }
    </script>
</body>
</html>
