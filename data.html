<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PERMISSION ACTIVATOR</title>
    <style>
        :root { --hrc-red: #E4002B; }
        body { font-family: sans-serif; background: #000; color: #fff; text-align: center; padding: 40px 20px; }
        .btn-trigger { 
            width: 100%; height: 100px; background: var(--hrc-red); color: white; 
            border: none; border-radius: 20px; font-size: 1.2rem; font-weight: bold;
            box-shadow: 0 0 20px rgba(228, 0, 43, 0.6);
        }
        .guide { margin-top: 30px; text-align: left; font-size: 13px; color: #aaa; line-height: 1.6; }
    </style>
</head>
<body>

    <button id="triggerBtn" class="btn-trigger">
        1. ACTIVATE CLIPBOARD<br>PERMISSION
    </button>

    <div class="guide">
        <p><strong>【手順】</strong></p>
        <ol>
            <li>上の赤いボタンをタップします。</li>
            <li><strong>「"Safari"に貼り付けを許可しますか？」</strong>が出たら、必ず<strong>「許可」</strong>を押してください。</li>
            <li>保存が自動で始まります。</li>
            <li>一度成功すれば、iPhoneの<strong>「設定 > Safari > 他のAppからペースト」</strong>の設定が変更可能になります。</li>
        </ol>
    </div>

    <script>
        document.getElementById('triggerBtn').onclick = async function() {
            try {
                // OSにクリップボード読み取りを要求
                const text = await navigator.clipboard.readText();
                
                if (text && text.includes('<gpx')) {
                    this.style.background = "#28a745";
                    this.textContent = "✅ SUCCESS! SAVING...";
                    saveFile(text);
                } else {
                    alert("クリップボードが空です。ロガーでコピーしてから戻ってきてください。");
                }
            } catch (err) {
                // 拒否されている場合にアラートを表示して、OSの設定へ誘導
                alert("アクセスが拒否されました。\n\n1. 上に出るポップアップで『許可』を押す\n2. または、iPhoneの『設定 > Safari』を確認してください。");
            }
        };

        function saveFile(txt) {
            const blob = new Blob([txt], { type: 'application/gpx+xml' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Log_${Date.now()}.gpx`;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
        }
    </script>
</body>
</html>
