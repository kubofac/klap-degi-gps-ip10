<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GPX Export (Safari)</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, sans-serif; 
            background: #121212; color: #fff; 
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; height: 100vh;
        }
        h2 { color: #ff9900; margin: 10px 0; font-size: 1.5rem; text-align: center; }
        p { font-size: 0.9rem; color: #aaa; text-align: center; margin-bottom: 15px; }
        
        textarea {
            width: 100%; flex-grow: 1;
            background: #222; color: #0f0;
            border: 2px solid #444; border-radius: 12px;
            padding: 12px; font-family: monospace; font-size: 14px;
            margin-bottom: 20px; outline: none;
        }
        textarea:focus { border-color: #ff9900; }

        .btn-save {
            width: 100%; height: 80px;
            background: #28a745; color: white;
            border: none; border-radius: 15px;
            font-size: 1.2rem; font-weight: bold;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
            cursor: pointer; -webkit-tap-highlight-color: transparent;
        }
        .btn-save:active { background: #218838; transform: scale(0.98); }

        .footer-link {
            display: block; margin-top: 15px;
            color: #888; text-decoration: none; font-size: 0.8rem; text-align: center;
        }
    </style>
</head>
<body>

    <h2>GPX書き出し</h2>
    <p>コピーした内容を貼り付けて保存を押してください</p>

    <textarea id="input" placeholder="ここにペースト..."></textarea>

    <button class="btn-save" onclick="save()">GPXファイルとして保存</button>
    
    <a href="#" class="footer-link" onclick="document.getElementById('input').value=''; return false;">入力をクリア</a>

    <script>
        function save() {
            const txt = document.getElementById('input').value.trim();
            if(!txt.includes('<gpx')) {
                alert("有効なGPXデータが見つかりません。");
                return;
            }
            try {
                const blob = new Blob([txt], { type: 'application/gpx+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Log_${Date.now()}.gpx`;
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 100);
                alert("保存を開始しました。Safariのダウンロードを確認してください。");
            } catch (e) {
                alert("エラー: " + e.message);
            }
        }
    </script>
</body>
</html>
